<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F7F7">
<title>Focússimo Sprint — 8 недель</title>
<meta name="description" content="Фокуссимо Спринт — система планирования на 8 недель: цель, инструменты, задачи, привычки, трекеры и аналитика.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F7F7;
  --ink:#2E2E2E;
  --white:#FFFFFF;
  /* Бедже (базовая) */
  --head:#E8DCD0;
  --head-ink:#574F44;
  --row:#FAF6F2;
  --row-hi:#FFFDFB;
  --chipbg:#F2EAE2;
  --accent:#2E6B8A;
  --accent-d:#24566E;
  --accent-soft:rgba(46,107,138,.28);
  --muted:#6E675E;
  --line:#EAE0D1;
  --line-soft:#F1E9DD;
  --sand:#DFD2C0;
  --track:#EFE7DB;
  --dash:#EFE5D8;
  --focus:#E4D7C4;
  --ph:#BDB2A2;
  --chk-line:#D9CBB8;
  --star-off:#D9CDBC;
  --rm:#C9BEAC;
  --add-hi:#F2E7D8;
  --done-ink:#A39A8D;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{background:var(--bg)}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Montserrat',sans-serif;
  font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;min-height:100dvh;
  overscroll-behavior-y:none;
}
img{display:block}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes rowflash{0%{background:#F7EAD2}100%{}}

.app{max-width:980px;margin:0 auto;padding:14px 14px 92px}

/* ---------- логотип ---------- */
.hero{display:flex;justify-content:center;align-items:center;animation:rise .5s ease both}
.logo{width:min(52vw,180px);height:auto;margin:6px auto 0;display:block}

/* ---------- выбор недели ---------- */
.wk-pills{
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  padding:12px 2px 2px;
  -webkit-overflow-scrolling:touch;
  user-select:none;-webkit-user-select:none;
}
.wk-pills::-webkit-scrollbar{display:none}
.wk{
  flex:none;min-width:64px;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  border:1px solid var(--line);background:var(--white);
  border-radius:12px;padding:7px 10px 6px;
  font-family:'Montserrat',sans-serif;
  transition:background .15s,border-color .15s,opacity .15s;
}
.wk b{font-size:11px;font-weight:500;letter-spacing:.08em}
.wk small{font-size:10px;color:var(--muted);font-weight:500;font-family:'Montserrat',sans-serif}
.wk.cur{background:var(--accent);border-color:var(--accent)}
.wk.cur b{color:#fff}
.wk.cur small{color:#D8EAF3}
.wk.lock{opacity:.45;border-style:dashed;cursor:default}
.wk:active{transform:scale(.96)}

/* ---------- панель спринта ---------- */
.weekbar{
  margin-top:12px;
  background:var(--white);
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  box-shadow:0 1px 2px rgba(46,46,46,.03),0 10px 24px rgba(46,46,46,.04);
  animation:rise .5s .05s ease both;
  user-select:none;-webkit-user-select:none;
}
.wb-left{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.wb-label{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.wb-range{font-family:'Montserrat',sans-serif;font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.wb-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wb-date{
  border:1px solid var(--line);border-radius:9px;background:var(--row);
  font-family:'Montserrat',sans-serif;font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--ink);
  padding:7px 8px;max-width:158px;
}
.btn-ghost{
  border:1px solid var(--line);background:var(--white);color:var(--muted);
  border-radius:999px;padding:9px 14px;font-size:11px;font-weight:500;letter-spacing:.08em;
  transition:background .15s,color .15s,border-color .15s;
}
.btn-ghost:hover{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- навигация: спринт + 7 дней ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:var(--white);
  border-top:1px solid var(--line);
  display:flex;overflow-x:auto;scrollbar-width:none;
  padding:0 2px calc(env(safe-area-inset-bottom) + 2px);
  box-shadow:0 -6px 18px rgba(46,46,46,.06);
  user-select:none;-webkit-user-select:none;
}
.nav::-webkit-scrollbar{display:none}
.nav .tab{
  flex:1 0 auto;min-width:44px;position:relative;
  border:none;background:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  padding:11px 3px 9px;color:var(--muted);
  font-family:'Montserrat',sans-serif;font-size:11px;font-weight:500;letter-spacing:.08em;
  transition:color .15s;
}
.nav .tab.main{color:var(--accent)}
.nav .tab.past{color:var(--accent)}
.nav .tab.active{color:var(--accent)}
.nav .tab.active::before{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:20px;height:2px;border-radius:0 0 3px 3px;background:var(--accent);
}
.nav .tab.alt{background:var(--accent);color:#fff}
.nav .tab.alt.active::before{background:#fff}
.nav .tab.checked{background:var(--accent);color:#fff}
.nav .tab.checked.active::before{background:#fff}
.nav .tchk{position:absolute;top:5px;right:6px;width:11px;height:11px}
.nav .tchk path{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

.nav .tab:active{opacity:.65}

main{margin-top:16px}
.view{max-width:640px;margin:0 auto;animation:rise .3s ease both}
.view[hidden]{display:none}

/* ---------- карточки ---------- */
.card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  margin-bottom:14px;
  box-shadow:0 1px 2px rgba(46,46,46,.03),0 10px 24px rgba(46,46,46,.04);
}
  .section-head{
  background:var(--head);
  font-family:'Montserrat',sans-serif;font-weight:600;
  font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--head-ink);
  padding:11px 14px;
  display:flex;align-items:center;gap:8px;
  user-select:none;-webkit-user-select:none;
}
#v-sprint .section-head{font-size:11px;font-weight:600;letter-spacing:.08em}
.sh-ic{display:inline-flex;color:var(--accent);flex:none}
.sh-ic svg{display:block}
.sh-badge{
  margin-left:auto;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:600;letter-spacing:.02em;
  background:var(--white);border-radius:999px;padding:3px 10px;color:var(--accent);
}
.kv{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;border-top:1px solid var(--line-soft);
  font-size:14.5px;
}
.kv:first-of-type{border-top:none}
.kv b{font-family:'Montserrat',sans-serif;font-weight:600}
.kv .accent{color:var(--accent)}
#v-sprint .kv{font-size:11px;font-weight:500;letter-spacing:.08em}
#v-sprint .kv b{font-weight:500}

.sec-h{
  display:flex;align-items:flex-end;gap:10px;margin-bottom:14px;flex-wrap:wrap;
}
.sec-h h2{font-family:'Montserrat',sans-serif;font-weight:500;font-size:11px;letter-spacing:.08em;color:var(--ink)}
.sec-h .sub{font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--muted);margin-top:2px}

.print-only{display:none}

/* ---------- кнопка скачать ---------- */
.dl{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line);background:var(--white);color:var(--muted);
  border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:500;letter-spacing:.02em;
  transition:background .15s,color .15s,border-color .15s;
}
.dl:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.dl svg{display:block}

/* ---------- кольцо прогресса ---------- */
.ring{position:relative;display:inline-block;flex:none}
.ring svg{display:block}
.ring .val{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Montserrat',sans-serif;font-weight:700;color:var(--accent);
}
.week-progress{display:flex;align-items:center;gap:18px;padding:16px;flex-wrap:wrap}
.ring-big .val{font-size:24px;letter-spacing:-.02em}

/* ---------- строка недели в статистике ---------- */
.wkrow{display:flex;align-items:center;gap:12px;padding:9px 14px;border-top:1px solid var(--line-soft);font-size:14px}
.wkrow:first-of-type{border-top:none}
.wkrow-l{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.wkrow-l b{font-family:'Montserrat',sans-serif;font-size:13px;font-weight:600;letter-spacing:.01em}
.wkrow-l small{font-size:11px;color:var(--muted)}
.wkrow .tag{
  flex:none;font-family:'Montserrat',sans-serif;font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  border-radius:999px;padding:3px 9px;
}
.tag.cur{background:var(--accent);color:#fff}
.tag.past{background:var(--row);color:var(--muted)}
.tag.lock{background:var(--row);color:var(--ph)}
.wkrow b.cnt{width:44px;flex:none;text-align:right;font-family:'Montserrat',sans-serif;font-size:13px;font-weight:600}
.lrow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line-soft)}
.lrow-l{flex:none;width:104px;min-width:0;display:flex;flex-direction:column;gap:1px;line-height:1.2}
.lrow-l b{font-family:'Montserrat',sans-serif;font-size:12px;color:var(--ink)}
.lrow-l small{font-size:9.5px;color:var(--muted);white-space:nowrap}
.lbar{flex:1;height:10px;background:var(--track);border-radius:99px;overflow:hidden;display:block}
.lbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.lpct{flex:none;width:42px;text-align:right;font-family:'Montserrat',sans-serif;font-size:12.5px;font-weight:600;color:var(--ink)}
/* строки «Неделя N» на главной: текст как в «Прогресс спринта» (.kv — 14.5px), полоса на всю ширину */
.hrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line-soft)}
.hrow:first-child{border-top:none}
.hrow-l{flex:none;width:92px;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.08em}
.hrow-bar{flex:1;height:12px;background:var(--track);border-radius:99px;overflow:hidden;display:block}
.hrow-bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.hrow-v{flex:none;width:52px;text-align:right;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--ink)}
.dwrap{flex:1;position:relative;height:12px}
.dcenter{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line)}
.dbar{position:absolute;top:0;bottom:0;border-radius:99px}
.empty-hint{padding:16px 14px;font-size:11.5px;color:var(--ph);text-align:center}
.chart-pad{padding:8px 10px 10px}

/* ---------- вертикальные бары ---------- */
.vb-grid{display:grid;grid-template-columns:1fr;gap:18px;padding:16px}
@media(min-width:640px){.vb-grid{grid-template-columns:repeat(3,1fr)}}
.vb-block .vb-title{display:flex;align-items:baseline;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:10px;letter-spacing:.04em;text-transform:uppercase;font-family:'Montserrat',sans-serif;font-weight:500}
.vb-block .vb-title b{font-family:'Montserrat',sans-serif;font-size:13.5px;color:var(--accent);letter-spacing:0;text-transform:none;font-weight:600}
.vbars{display:flex;gap:5px;align-items:flex-end;height:88px}
.vbcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.vbcol b{font-size:10px;color:var(--muted);height:13px;line-height:13px;font-weight:500;font-family:'Montserrat',sans-serif}
.vbbg{width:100%;max-width:20px;height:62px;background:var(--row);border-radius:5px;display:flex;align-items:flex-end;overflow:hidden}
.vbbg i{display:block;width:100%;background:var(--accent);border-radius:5px;transition:height .4s ease}
.vbcol span{font-size:10px;color:var(--muted);font-family:'Montserrat',sans-serif;font-weight:500}

/* ---------- задачи ---------- */
.task{
  display:flex;align-items:center;gap:10px;
  padding:8px 12px;min-height:46px;
  border-top:1px solid var(--line-soft);
}
.task:first-child{border-top:none}
.task:nth-child(odd){background:var(--white)}
.task:nth-child(even){background:var(--row)}
.task.flash{animation:rowflash 1.2s ease}
.chk{
  width:28px;height:28px;flex:none;
  border-radius:9px;border:1.5px solid var(--chk-line);background:var(--chipbg);
  display:grid;place-items:center;padding:0;
  transition:background .12s,border-color .12s;
}
.chk svg{width:16px;height:16px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk.on svg{opacity:1;animation:pop .18s ease}
.task-in{
  flex:1;min-width:0;border:none;background:transparent;
  font-family:'Montserrat',sans-serif;font-size:16px;color:var(--ink);
  padding:6px 2px;
}
.task-in:focus{outline:none;background:var(--white);box-shadow:0 0 0 2px var(--focus)}
.task-in::placeholder{color:var(--ph)}
.task.done .task-in{color:var(--done-ink);text-decoration:line-through}
.rmbtn{
  width:28px;height:28px;flex:none;border-radius:50%;
  border:1px solid transparent;background:transparent;
  color:var(--rm);font-size:16px;line-height:1;
  display:grid;place-items:center;transition:color .12s,border-color .12s;
}
.rmbtn:hover{color:var(--accent);border-color:var(--line)}

/* ---------- кнопки добавить ---------- */
.addbtn{
  width:calc(100% - 24px);margin:10px 12px 12px;
  display:flex;align-items:center;justify-content:center;gap:7px;
  border:1.5px dashed var(--chk-line);background:var(--row);color:var(--accent);
  border-radius:11px;padding:11px;font-size:14px;font-weight:500;letter-spacing:.02em;
  transition:background .15s,border-color .15s;
}
.addbtn:hover{background:var(--add-hi);border-color:var(--accent)}
.addbtn svg{display:block;flex:none}

/* ---------- лента дня ---------- */
.dayhead{
  display:flex;align-items:center;gap:12px;
  background:var(--head);padding:14px 16px;
  user-select:none;-webkit-user-select:none;
}
.dayhead b{font-family:'Montserrat',sans-serif;font-weight:600;font-size:20px;letter-spacing:-.01em;color:var(--accent)}
.dayhead .dh-sub{font-size:12.5px;color:var(--head-ink);margin-top:2px;letter-spacing:.02em}
.dayhead .dh-done{font-size:12px;font-weight:500;color:var(--accent);letter-spacing:.03em;margin-top:3px}
.ring-dh{margin-left:auto}
.ring-dh .ring .val{font-size:12px}
.daypanel{position:relative}

.dgrid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){
  .dgrid{grid-template-columns:1.35fr 1fr;align-items:start}
  .dcol-side{display:grid;gap:14px}
}

/* ---------- привычки ---------- */
.hab-day{display:flex;align-items:center;gap:10px;padding:8px 14px;min-height:48px;border-top:1px solid var(--line-soft)}
.hab-day:first-of-type{border-top:none}
.hchk{
  width:32px;height:32px;border-radius:9px;flex:none;
  border:1.5px solid var(--chk-line);background:var(--chipbg);
  display:grid;place-items:center;padding:0;
  transition:background .12s,border-color .12s;
}
.hchk svg{width:17px;height:17px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.hchk.on{background:var(--accent);border-color:var(--accent)}
.hchk.on svg{opacity:1;animation:pop .18s ease}
.hab-name{
  flex:1;min-width:0;border:none;background:transparent;
  font-family:'Montserrat',sans-serif;font-size:16px;font-weight:500;color:var(--ink);
  padding:6px 2px;
}
.hab-name:focus{outline:none;background:var(--white);box-shadow:0 0 0 2px var(--focus)}

/* ---------- вечерние трекеры ---------- */
.tracker-row{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-top:1px solid var(--line-soft);font-size:14px;gap:10px;flex-wrap:wrap;user-select:none;-webkit-user-select:none}
.tracker-row:first-of-type{border-top:none}
.tracker-row .tl{color:var(--ink);display:flex;align-items:center;gap:8px;font-family:'Montserrat',sans-serif;font-size:13px;font-weight:500;letter-spacing:.03em}
.tracker-row .tl svg{color:var(--accent)}
.tracker-row .tl-in{
  border:none;background:transparent;
  font-family:'Montserrat',sans-serif;font-size:13px;font-weight:500;letter-spacing:.03em;color:var(--ink);
  width:118px;padding:2px 5px;margin:-2px -5px;border-radius:6px;
  user-select:text;-webkit-user-select:text;
}
.tracker-row .tl-in:focus{outline:none;background:var(--row);box-shadow:0 0 0 2px var(--focus)}
.week-progress .ring,.tri-rings .ring{width:min(116px,calc((100vw - 60px)/3))!important;height:min(116px,calc((100vw - 60px)/3))!important}
.week-progress .ring svg,.tri-rings .ring svg{width:100%!important;height:100%!important}
.tri-rings{display:flex;flex-wrap:nowrap;justify-content:space-between;align-items:flex-start;padding:14px 16px 18px}
.tri-rings .ring .val{font-size:15px!important}
@media(min-width:640px){.tri-rings .ring .val{font-size:20px!important}}
.tri-cell{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.tri-lbl{font-family:'Montserrat',sans-serif;font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--muted);text-align:center;max-width:116px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stars{display:inline-flex;gap:2px}
.stars button{
  border:none;background:none;
  font-size:21px;line-height:1;color:var(--star-off);padding:3px 2px;
  transition:transform .1s,color .1s;
}
.stars button.on{color:var(--accent)}
.stars button:active{transform:scale(1.25)}
.sleep-wrap{display:flex;align-items:center;gap:7px;user-select:none;-webkit-user-select:none}
.sleep-wrap input{
  width:76px;border:1px solid var(--line);border-radius:9px;background:var(--row);
  font-family:'Montserrat',sans-serif;font-weight:600;font-size:16px;color:var(--ink);
  padding:8px 8px;text-align:center;
}
.sleep-wrap input:focus{outline:none;box-shadow:0 0 0 2px var(--focus)}
.sleep-wrap i{font-style:normal;font-size:12.5px;color:var(--muted)}

/* ---------- дневник ---------- */
.jf-grid{display:grid;grid-template-columns:1fr;gap:0}
.jf{padding:12px 14px;border-top:1px solid var(--line-soft)}
.jf:first-of-type{border-top:none}
@media(min-width:640px){
  .jf-grid{grid-template-columns:1fr 1fr}
  .jf.jf-wide{grid-column:1 / -1}
}
.jf label{display:block;font-family:'Montserrat',sans-serif;font-size:11px;color:var(--muted);margin-bottom:7px;font-weight:500;letter-spacing:.07em;text-transform:uppercase}
.jf textarea{
  width:100%;border:none;background:var(--row);border-radius:10px;
  font-family:'Montserrat',sans-serif;font-size:16px;color:var(--ink);
  padding:10px 12px;resize:vertical;min-height:48px;line-height:1.5;
}
.jf textarea:focus{outline:none;background:var(--row-hi);box-shadow:0 0 0 2px var(--focus)}
.jf textarea::placeholder{color:var(--ph)}
#v-sprint .jf label{letter-spacing:.08em}
#v-sprint .jf textarea{font-size:11px;font-weight:500;letter-spacing:.08em}

/* ---------- статистика спринта ---------- */
.ovgrid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){
  .ovgrid{grid-template-columns:1fr 1fr}
  .ov-wide{grid-column:1 / -1}
}

/* ---------- итоги спринта ---------- */
.verdict-row{display:flex;gap:8px;padding:12px 14px 0;flex-wrap:wrap}
.vbtn{flex:1;min-width:130px;border:1.5px solid var(--line);background:var(--row);color:var(--muted);border-radius:11px;padding:10px;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:500;letter-spacing:.08em;transition:background .15s,color .15s,border-color .15s}
.vbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-finish{
  border:1px solid var(--accent);background:var(--accent);color:#fff;
  border-radius:999px;padding:9px 14px;font-size:11px;font-weight:500;letter-spacing:.08em;white-space:nowrap;
}
.btn-finish:active{transform:scale(.98)}

/* ===== ДЕМО «Главная два» (временная витрина диаграмм) ===== */
.demo-note{font-size:12px;color:var(--muted);line-height:1.5}
.demo-note b{color:var(--ink);font-weight:600}
.dl-row{display:flex;align-items:center;gap:10px;padding:8px 0}
.dl-row .lbl{width:96px;flex:none;font-size:12px;color:var(--muted)}
.dl-track{flex:1;height:10px;background:var(--track);border-radius:99px;overflow:hidden}
.dl-fill{height:100%;background:var(--accent);border-radius:99px}
.dl-val{width:52px;flex:none;text-align:right;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:600;color:var(--ink)}
.demo-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--muted);align-items:center}
.demo-legend .sw{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px}
.hc{width:12px;height:12px;border-radius:3px;display:block}

/* ---------- тост ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);
  background:var(--ink);color:#fff;border-radius:999px;
  padding:11px 18px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;z-index:50;max-width:88vw;text-align:center;
  user-select:none;-webkit-user-select:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ================= ПЕЧАТЬ (A4, книжная) ================= */
@page{size:A4 portrait;margin:10mm}
@media print{
  body{background:#fff;font-size:11px}
  .hero,.weekbar,.wk-pills,.nav,.toast,.addbtn,.rmbtn,.no-print,.dl,.vbtn,.btn-finish{display:none!important}
  .app{max-width:none;padding:0}
  main{margin-top:0}
  .view{display:none!important;max-width:none;animation:none}
  body[data-print="sprint"] #v-sprint{display:block!important}
  .card{margin-bottom:8px;border-radius:10px;box-shadow:none;break-inside:avoid}
  .section-head{padding:7px 10px;font-size:10px;letter-spacing:.06em}
  .print-only{display:block!important}
  .sec-h{margin-bottom:8px}
  .sec-h h2{font-size:11px}
  .sec-h .sub{font-size:11px}
  .ovgrid{grid-template-columns:1fr 1fr;gap:8px}
  .ovgrid .ov-wide{grid-column:1 / -1}
  .kv{padding:5px 10px;font-size:10.5px}
  .wkrow{padding:5px 10px;font-size:10.5px}
  .wkrow-l b{font-size:10.5px}
  .wkrow-l small{font-size:9px}
  .wkrow b.cnt{font-size:10px;width:38px}
  .wkrow .tag{font-size:8px;padding:2px 7px}
  .week-progress{padding:10px;gap:12px}
  .ring svg{width:100%!important;height:100%!important}
  .week-progress .ring{width:92px!important;height:92px!important}
  .week-progress .ring .val{font-size:15px!important}
  .vb-grid{padding:10px;gap:10px}
  .vbars{height:58px}
  .vbbg{height:40px}
  .vb-block .vb-title{margin-bottom:6px;font-size:9.5px}
  .vb-block .vb-title b{font-size:10.5px}
  .jf textarea,.sleep-wrap input{
    border:none!important;background:transparent!important;box-shadow:none!important;
  }
  .jf{padding:6px 10px}
  .jf textarea{font-size:10.5px;min-height:26px;background:#FAF6F2}
  .jf label{font-size:8.5px;margin-bottom:4px}
  .sh-badge{font-size:9.5px;padding:2px 8px}
  .section-head .sh-ic svg{width:13px!important;height:13px!important}
}
</style>

    plus:'<path d="M12 5v14M5 12h14"/>',

}

/* ================= даты ================= */
function toISO(d){ return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); }
function parseISO(s){ var p=s.split('-'); return new Date(Date.UTC(+p[0],+p[1]-1,+p[2])); }
function addDaysISO(s,n){ var d=parseISO(s); d.setUTCDate(d.getUTCDate()+n); return toISO(d); }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function mondayOf(d){ var x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); var wd=(x.getUTCDay()+6)%7; x.setUTCDate(x.getUTCDate()-wd); return toISO(x); }
function absDayDateISO(a){ return addDaysISO(state.sprintStart, a); }
function dayDow(a){ return parseISO(absDayDateISO(a)).getUTCDay(); }
function dayFull(a){ return DOW_FULL[dayDow(a)]; }
function day3(a){ return DOW3[dayDow(a)]; }
function day2(a){ return DOW2[dayDow(a)]; }
function fmtDayYear(a){ var d=parseISO(absDayDateISO(a)); return d.getUTCDate()+' '+MONTHS[d.getUTCMonth()]+', '+d.getUTCFullYear(); }
function fmtShort(iso){ var d=parseISO(iso); return String(d.getUTCDate()).padStart(2,'0')+'.'+String(d.getUTCMonth()+1).padStart(2,'0'); }
function weekStartISO(w){ return addDaysISO(state.sprintStart, w*7); }
function weekRangeLabel(w){
  var a=weekStartISO(w), b=addDaysISO(a,6);
  return fmtShort(a)+' – '+fmtShort(b);
}
function sprintRangeLabel(){
  var a=state.sprintStart, b=addDaysISO(a, WEEKS*7-1);
  var da=parseISO(a), db=parseISO(b);
  return da.getUTCDate()+' '+MONTHS[da.getUTCMonth()]+' – '+db.getUTCDate()+' '+MONTHS[db.getUTCMonth()]+', '+db.getUTCFullYear();
}
function weekOfAbs(a){ return Math.floor(a/7); }
/* ================= состояние ================= */
function emptyTask(){ return {t:'',done:false}; }
function defDay(){
  var tasks=[]; for(var k=0;k<10;k++) tasks.push(emptyTask());
  return {tasks:tasks, sleep:'', energy:0, mood:0, wisdom:'', thanks:'', thoughts:''};
}
function defState(){
  var days=[];
  for(var a=0;a<WEEKS*7;a++) days.push(defDay());
  return {
    sprintStart: mondayOf(new Date()),
    activeWeek:0,
    maxUnlocked:0,
    goal:'',
    tools:'',
    finished:null,
    retro:{good:'',bad:'',next:''},
    trackNames:{energy:'Энергия',mood:'Настроение'},
    days: days,
    habits: DEF_HABITS.map(function(n){
      var arr=[]; for(var a=0;a<WEEKS*7;a++) arr.push(false);
      return {name:n, days:arr};
    })
  };
}
function fixShape(s){
  var d = defState();
  if(!s || typeof s!=='object') return d;
  s.sprintStart = s.sprintStart || d.sprintStart;
  s.goal = String(s.goal||'');
  s.tools = Array.isArray(s.tools)? s.tools.map(String).join('\n') : String(s.tools||'');
  if(s.finished!=='done' && s.finished!=='not' && s.finished!=='pending') s.finished = null;
  if(!s.retro || typeof s.retro!=='object') s.retro = {good:'',bad:'',next:''};
  s.retro.good=String(s.retro.good||''); s.retro.bad=String(s.retro.bad||''); s.retro.next=String(s.retro.next||'');
  if(!s.trackNames || typeof s.trackNames!=='object') s.trackNames = {energy:'Энергия',mood:'Настроение'};
  s.trackNames.energy = String(s.trackNames.energy||'Энергия');
  s.trackNames.mood = String(s.trackNames.mood||'Настроение');
  s.maxUnlocked = Math.min(WEEKS-1, Math.max(0, +s.maxUnlocked||0));
  var aw = +s.activeWeek;
  if(!(aw>=0 && aw<=s.maxUnlocked)) aw = s.maxUnlocked;
  s.activeWeek = aw;
  s.habits = Array.isArray(s.habits) && s.habits.length ? s.habits : d.habits;
  s.days = (Array.isArray(s.days) && s.days.length===WEEKS*7) ? s.days : d.days;
  for(var i=0;i<WEEKS*7;i++){
    var dd = s.days[i] || {};
    if(!Array.isArray(dd.tasks) || !dd.tasks.length) dd.tasks = d.days[i].tasks;
    if(typeof dd.sleep!=='string') dd.sleep='';
    dd.energy = +dd.energy||0; dd.mood = +dd.mood||0;
    dd.wisdom=dd.wisdom||''; dd.thanks=dd.thanks||''; dd.thoughts=dd.thoughts||'';
    s.days[i]=dd;
  }
  for(var h=0;h<s.habits.length;h++){
    if(!Array.isArray(s.habits[h].days) || s.habits[h].days.length!==WEEKS*7){
      var arr=[]; for(var z=0;z<WEEKS*7;z++) arr.push(false);
      s.habits[h].days=arr;
    }
  }
  return s;
}
function load(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(raw) return fixShape(JSON.parse(raw));
  }catch(e){}
  return defState();
}
var state = load();
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }

/* ================= статистика ================= */
function dayTasksList(a){ return state.days[a].tasks.filter(function(t){return String(t.t).trim();}); }
function dayStats(a){
  var list = dayTasksList(a);
  var done = list.filter(function(t){return t.done;}).length;
  return {non:list.length, done:done, proc:list.length-done, pct: list.length? Math.round(done/list.length*100) : 0};
}
function updateFinishBtn(){
  var el = document.getElementById('btnFinish');
  if(!el) return;
  var last = WEEKS*7-1;
  el.hidden = !(curView==='d6' && state.activeWeek===WEEKS-1 && !state.finished && dayStats(last).done>0);
}
function updateDownloadBtn(){
  var el = document.getElementById('btnDownload');
  if(!el) return;
  el.hidden = !state.finished;
}
function weekStats(w){
  var non=0, done=0;
  for(var a=w*7;a<w*7+7;a++){ var s=dayStats(a); non+=s.non; done+=s.done; }
  return {non:non, done:done, proc:non-done, pct: non? Math.round(done/non*100):0};
}
function sprintStats(){
  var non=0, done=0;
  for(var a=0;a<WEEKS*7;a++){ var s=dayStats(a); non+=s.non; done+=s.done; }
  return {non:non, done:done, proc:non-done, pct: non? Math.round(done/non*100):0};
}
function sleepVal(a){
  var m = String(state.days[a].sleep).match(/(\d+[.,]?\d*)/);
  return m ? parseFloat(m[1].replace(',','.')) : 0;
}
function tnName(kind){
  var n = (state.trackNames && state.trackNames[kind]) || '';
  return n.trim() || (kind==='energy' ? 'Энергия' : 'Настроение');
}
function trackerWeekAvg(w, kind){
  var sum=0, cnt=0;
  for(var a=w*7;a<w*7+7;a++){
    var v = kind==='sleep'? sleepVal(a) : (+state.days[a][kind]||0);
    if(v>0){ sum+=v; cnt++; }
  }
  return cnt? {avg:sum/cnt, cnt:cnt} : null;
}

/* ================= утилиты рендера ================= */
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function ringHTML(pct, size, sw, fs){
  pct = Math.max(0, Math.min(100, Math.round(pct)));
  var r=(size-sw*2)/2, c=2*Math.PI*r, off=c*(1-pct/100);
  return '<div class="ring" style="width:'+size+'px;height:'+size+'px">'
    + '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'
    + '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--track)" stroke-width="'+sw+'"/>'
    + '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--accent)" stroke-width="'+sw+'" stroke-linecap="round" '
    + 'stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+(size/2)+' '+(size/2)+')" style="transition:stroke-dashoffset .6s ease"/>'
    + '</svg><div class="val" style="font-size:'+fs+'px">'+pct+'%</div></div>';
}
function starPicker(prefix, val){
  var h='<span class="stars" role="slider" aria-valuemin="0" aria-valuemax="5" aria-valuenow="'+val+'">';
  for(var k=1;k<=5;k++) h += '<button type="button" data-loc="'+prefix+k+'" class="'+(k<=val?'on':'')+'" aria-label="'+k+' из 5">★</button>';

}

var curView = 'sp';

function setView(v){

  });
  var sp = document.getElementById('v-sprint');

  if(v==='sp'){
    sp.hidden = false; dy.hidden = true; dm.hidden = true;

  } else if(v==='demo'){
    sp.hidden = true; dy.hidden = true; dm.hidden = false;

function setActiveWeek(w){

  if(curView==='sp') renderSprint(); else renderDay(state.activeWeek*7 + (curView==='sp'?0:+curView.charAt(1)));
}

/* строки-графика: линия по неделям и расходящиеся полосы (общие для главной и демо) */
function chartLineWeeks(vals, minV, maxV, gridVals, unit){
  var n=vals.length, W=340, H=150, x0=36, x1=W-12, yTop=16, yBot=H-30;
  function X(i){ return n===1? (x0+x1)/2 : x0+i*(x1-x0)/(n-1); }
  function Y(v){ return yBot-(v-minV)/(maxV-minV)*(yBot-yTop); }
  var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block">';
  gridVals.forEach(function(g){
    var y=Y(g);
    svg+='<line x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'" stroke="var(--dash)" stroke-width="1" stroke-dasharray="3 4"/>';
    svg+='<text x="'+(x0-6)+'" y="'+(y+3)+'" text-anchor="end" font-size="9" fill="var(--ph)">'+g+(unit||'')+'</text>';
  });
  var pts=[];
  for(var i=0;i<n;i++){ if(vals[i]!=null) pts.push([X(i),Y(vals[i]),vals[i],i]); }
  if(pts.length>1){
    svg+='<path d="M'+pts[0][0].toFixed(1)+','+yBot+' L'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' L')+' L'+pts[pts.length-1][0].toFixed(1)+','+yBot+' Z" fill="var(--accent-soft)" opacity=".5" stroke="none"/>';
    svg+='<polyline points="'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
  }
  pts.forEach(function(p){
    svg+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="var(--white)" stroke="var(--accent)" stroke-width="1.8"/>';
    svg+='<text x="'+p[0].toFixed(1)+'" y="'+(p[1]-9).toFixed(1)+'" text-anchor="middle" font-size="9.5" font-weight="600" font-family="Montserrat,sans-serif" fill="var(--ink)">'+p[2].toFixed(1)+(unit||'')+'</text>';
    svg+='<text x="'+p[0].toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9" fill="var(--muted)">'+(p[3]+1)+'</text>';
  });
  return svg+'</svg>';
}
function ringVal(pct, size, sw, fs, txt){
  pct = Math.max(0, Math.min(100, Math.round(pct)));
  var r=(size-sw*2)/2, c=2*Math.PI*r, off=c*(1-pct/100);
  return '<div class="ring" style="width:'+size+'px;height:'+size+'px">'

function demoArc(cx,cy,r,a0,a1){
  function p(a){ return [cx+r*Math.cos(a*Math.PI/180), cy+r*Math.sin(a*Math.PI/180)]; }
  var s=p(a0), e=p(a1), big=(a1-a0)>180?1:0;
  return 'M'+cx+' '+cy+' L'+s[0].toFixed(1)+' '+s[1].toFixed(1)+' A'+r+' '+r+' 0 '+big+' 1 '+e[0].toFixed(1)+' '+e[1].toFixed(1)+' Z';
}
function demoSpark(vals,w,hgt,stroke,fill){
  var min=Math.min.apply(null,vals), max=Math.max.apply(null,vals);
  var pts=vals.map(function(v,i){
    var x=4+i*(w-8)/(vals.length-1);
    var y=(hgt-4)-((v-min)/((max-min)||1))*(hgt-8);
    return x.toFixed(1)+','+y.toFixed(1);
  });
  var out='<svg width="'+w+'" height="'+hgt+'" viewBox="0 0 '+w+' '+hgt+'">';
  if(fill){ out+='<path d="M4,'+(hgt-4)+' L'+pts.join(' L')+' L'+(w-4)+','+(hgt-4)+' Z" fill="'+fill+'" opacity=".4" stroke="none"/>'; }
  return out+'<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+stroke+'" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

  /* ---------- КООЛЬЦО (ring / gauge-база) ---------- */
  function bRing(pct, o){
    o = o || {};
    var size = o.size || 150, sw = o.sw || 14;
    var pad = o.pad != null ? o.pad : sw/2+3;
    var cx = size/2, cy = size/2, r = (size - pad*2)/2;
    var start = (o.start != null ? o.start : -90);
    var sweep = (o.sweep != null ? o.sweep : 360);
    var col = o.col || 'var(--accent)';
    var s = '';
    if(o.glow) s += dArc(cx,cy,r,start,start+Math.min(359.8,sweep*0.999),sw+9,col,0.15);
    if(o.zones){ for(var z=0;z<o.zones.length;z++){ var zn=o.zones[z]; s+=dArc(cx,cy,r, zn[0], zn[1], sw, zn[2], zn[3]==null?1:zn[3]); } }
    if(sweep>=359.9) s += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+(o.track||'var(--track)')+'" stroke-width="'+sw+'"/>';
    else s += dArc(cx,cy,r,start,start+sweep,sw,o.track||'var(--track)');
    var frac = Array.isArray(pct) ? 1 : pct/100;
    if(Array.isArray(pct)){
      var a=start, gap=o.gap||0;
      for(var k=0;k<pct.length;k++){
        var seg=pct[k], s2=sweep*seg.v/100;
        if(s2>gap*1.5) s+=dArc(cx,cy,r,a+gap/2,a+s2-gap/2,sw,seg.col,seg.op==null?1:seg.op);
        a+=s2;
      }
    } else if(frac>0.004){
      var aEnd=start+sweep*frac;
      if(sweep*frac>=359.9) s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="'+sw+'" opacity="'+(o.op==null?1:o.op)+'"/>';
      else s+=dArc(cx,cy,r,start,aEnd,sw,col,o.op==null?1:o.op);
      if(o.endDot){ var ae=dRad(aEnd); s+='<circle cx="'+(cx+r*Math.cos(ae)).toFixed(1)+'" cy="'+(cy+r*Math.sin(ae)).toFixed(1)+'" r="'+(sw*0.42).toFixed(1)+'" fill="'+(o.endDotCol||'var(--ink)')+'" stroke="var(--white)" stroke-width="2"/>'; }
      if(o.dashRest){ var rem=sweep-sweep*frac; if(rem>3) s+=dArc(cx,cy,r,aEnd+2,start+sweep-0.5,sw*0.5,o.dashRestCol||'var(--sand)',1,'4 7'); }
      if(o.ghostArc) s+=dArc(cx,cy,r,aEnd,start+sweep,sw*0.55,o.ghostCol||'var(--sand)',1,'2 6');
    }
    if(o.target!=null && !Array.isArray(pct)){
      var ta=dRad(start+sweep*o.target/100);
      s+='<line x1="'+(cx+(r-sw/2-3)*Math.cos(ta)).toFixed(1)+'" y1="'+(cy+(r-sw/2-3)*Math.sin(ta)).toFixed(1)+'" x2="'+(cx+(r+sw/2+5)*Math.cos(ta)).toFixed(1)+'" y2="'+(cy+(r+sw/2+5)*Math.sin(ta)).toFixed(1)+'" stroke="var(--ink)" stroke-width="2"/>';
      if(o.targetLabel) s+='<text x="'+(cx+(r+sw/2+16)*Math.cos(ta)).toFixed(1)+'" y="'+(cy+(r+sw/2+16)*Math.sin(ta)+3).toFixed(1)+'" text-anchor="middle" font-size="8.5" font-weight="600" font-family="Montserrat,sans-serif" fill="var(--ink)">'+o.targetLabel+'</text>';
    }
    if(o.ticks && !Array.isArray(pct)){
      var n=o.ticks, on=frac;
      for(var k2=0;k2<n;k2++){
        var ak=start+sweep*k2/n, amk=dRad(ak);
        var act=(k2+0.5)/n<=on;
        s+='<line x1="'+(cx+(r+sw/2+3)*Math.cos(amk)).toFixed(1)+'" y1="'+(cy+(r+sw/2+3)*Math.sin(amk)).toFixed(1)+'" x2="'+(cx+(r+sw/2+(o.tickLen||8))*Math.cos(amk)).toFixed(1)+'" y2="'+(cy+(r+sw/2+(o.tickLen||8))*Math.sin(amk)).toFixed(1)+'" stroke="'+(act?col:'var(--track)')+'" stroke-width="'+(o.tickW||2)+'"/>';
      }
    }
    if(o.cells && !Array.isArray(pct)){
      var nc=o.cells;
      for(var k3=0;k3<nc;k3++){

      }

    if(o.needle && !Array.isArray(pct)){
      var nn=dRad(start+sweep*frac);
      s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+(r-sw)*0.85*Math.cos(nn)).toFixed(1)+'" y2="'+(cy+(r-sw)*0.85*Math.sin(nn)).toFixed(1)+'" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>';
      s+='<circle cx="'+cx+'" cy="'+cy+'" r="5" fill="var(--ink)"/>';
    }
    if(o.dotTrail && !Array.isArray(pct)){
      var nd=o.dotTrail;
      for(var k4=0;k4<=nd;k4++){
        var dk=start+sweep*frac*k4/nd, dm=dRad(dk);
        s+='<circle cx="'+(cx+r*Math.cos(dm)).toFixed(1)+'" cy="'+(cy+r*Math.sin(dm)).toFixed(1)+'" r="2.2" fill="'+col+'"/>';
      }

    if(o.center!=null) s+='<text x="'+cx+'" y="'+(cy+(o.centerDy||6))+'" text-anchor="middle" font-size="'+(o.centerFs||20)+'" font-weight="700" font-family="Montserrat,sans-serif" fill="var(--ink)">'+o.center+'</text>';

    if(o.startDot){ var sd=dRad(start); s+='<circle cx="'+(cx+r*Math.cos(sd)).toFixed(1)+'" cy="'+(cy+r*Math.sin(sd)).toFixed(1)+'" r="3" fill="var(--white)" stroke="'+col+'" stroke-width="2"/>'; }
    return svWrap(size,size,s);
  }

      else { s+=dArc(cx,cy,rg.r,-90,270,sw,'var(--track)'); if(rg.pct>0) s+=dArc(cx,cy,rg.r,-90,-90+360*rg.pct/100,sw,rg.col,rg.op==null?1:rg.op); }
    }
    if(o.center!=null) s+='<text x="'+cx+'" y="'+(cy+(o.centerDy||5))+'" text-anchor="middle" font-size="'+(o.centerFs||18)+'" font-weight="700" font-family="Montserrat,sans-serif" fill="var(--ink)">'+o.center+'</text>';

    return svWrap(size,size,s);
  }

  /* ---------- Круговая / донат ---------- */
  function bPie(segs, o){
    o=o||{};

    var r=(size-pad*2)/2, inner=o.inner||0, total=0;

      s+=dWedge(cx+offx,cy+offy,inner,r, a+(gap?gap/2:0), a1-(gap?gap/2:0), segs[i].col, segs[i].op==null?1:segs[i].op);

      }

    }
    if(o.center!=null) s+='<text x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle" font-size="'+(o.centerFs||18)+'" font-weight="700" font-family="Montserrat,sans-serif" fill="var(--ink)">'+o.center+'</text>';
    if(o.centerSub) s+='<text x="'+cx+'" y="'+(cy+20)+'" text-anchor="middle" font-size="8" fill="var(--muted)">'+o.centerSub+'</text>';

  /* ---------- Полярная многошвидная ---------- */
  function bPolar(vals, o){
    o=o||{};
    var size=o.size||220, cx=size/2, cy=size/2, R=o.R!=null?o.R:88;
    var n=vals.length, step=360/n, s='';
    if(o.grid){ var gn=o.grid; for(var g=1;g<=gn;g++) s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(R*g/gn).toFixed(1)+'" fill="none" stroke="var(--line-soft)" stroke-width="1"/>'; }
    var gap=o.gap||0, inner=o.inner||0;
    var cols=o.cols||['var(--accent)','#5E93B0','var(--accent-d)','#9FB9C9','var(--sand)','#B9A98F','#7E9AAB'];
    for(var i=0;i<n;i++){
      var v=vals[i];
      if(o.mode==='rose'){
        var rr=R*(o.rMode==='sqrt'?Math.sqrt(v/100):v/100);
        s+=dWedge(cx,cy,inner,rr, i*step+gap/2, (i+1)*step-gap/2, cols[i%7], o.op==null?(0.4+0.6*v/100):o.op);
      } else if(o.mode==='area'){
        s+=dWedge(cx,cy,inner,R*Math.sqrt(v/100), i*step, (i+1)*step, cols[i%7], 0.9);
      } else if(o.mode==='hist'){
        s+=dWedge(cx,cy,inner,R*v/100, i*step, (i+1)*step, o.col||'var(--accent)', 0.35+0.65*v/100);
        var ta=(i*45-90)*Math.PI/180;
        s+='<line x1="'+(cx+R*Math.cos(ta)).toFixed(1)+'" y1="'+(cy+R*Math.sin(ta)).toFixed(1)+'" x2="'+(cx+(R+4)*Math.cos(ta)).toFixed(1)+'" y2="'+(cy+(R+4)*Math.sin(ta)).toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>';
      } else if(o.mode==='bars'){
        var len=(R-inner)*v/100, rc=inner+len/2;
        s+=dArc(cx,cy,rc, i*step+(o.barPad!=null?o.barPad:6), (i+1)*step-(o.barPad!=null?o.barPad:6), Math.max(1.5,len), o.col||'var(--accent)', 0.4+0.6*v/100);
      } else if(o.mode==='line'){
        /* рисуем в конце */
      } else if(o.mode==='petal'){
        var rr2=R*(0.3+0.7*v/100);
        s+=dWedge(cx,cy,14,rr2, i*step+9, (i+1)*step-9, cols[i%7], 0.85);
        s+=dWedge(cx,cy,14,rr2, i*step+9, (i+1)*step-9, 'none', 1);
      } else if(o.mode==='dots'){
        var da=dRad(i*step+step/2), dr=(o.dR||16)+ (R-(o.dR||16)-10)*v/100;
        s+='<circle cx="'+(cx+dr*Math.cos(da)).toFixed(1)+'" cy="'+(cy+dr*Math.sin(da)).toFixed(1)+'" r="'+(3+5*v/100).toFixed(1)+'" fill="'+(o.col||'var(--accent)')+'" opacity="'+(0.35+0.65*v/100).toFixed(2)+'"/>';
      } else if(o.mode==='ticks'){
        var tt=dRad(i*step+step/2);
        s+='<line x1="'+(cx+(R-22)*Math.cos(tt)).toFixed(1)+'" y1="'+(cy+(R-22)*Math.sin(tt)).toFixed(1)+'" x2="'+(cx+(R-22+20*v/100)*Math.cos(tt)).toFixed(1)+'" y2="'+(cy+(R-22+20*v/100)*Math.sin(tt)).toFixed(1)+'" stroke="'+(o.col||'var(--accent)')+'" stroke-width="'+(o.tickW||6)+'" stroke-linecap="round" opacity="'+(0.35+0.65*v/100).toFixed(2)+'"/>';
      } else if(o.mode==='spokes'){
        var sp2=dRad(i*step+step/2);
        s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+R*v/100*Math.cos(sp2)).toFixed(1)+'" y2="'+(cy+R*v/100*Math.sin(sp2)).toFixed(1)+'" stroke="'+cols[i%7]+'" stroke-width="2" opacity=".85"/>';
      }
    }
    if(o.mode==='line' || o.mode==='web' || o.mode==='spider'){
      var pts=[];
      for(var i=0;i<n;i++){
        var la=dRad(i*step+step/2), lr3=(inner||16)+ (R-(inner||16))*vals[i]/100;
        pts.push([cx+lr3*Math.cos(la), cy+lr3*Math.sin(la)]);
      }
      if(o.mode!=='line'){ for(var g2=1;g2<=3;g2++){ var pp=[]; for(var i=0;i<n;i++){ var ga=dRad(i*step+step/2); pp.push((cx+R*g2/3*Math.cos(ga)).toFixed(1)+','+(cy+R*g2/3*Math.sin(ga)).toFixed(1)); } s+='<polygon points="'+pp.join(' ')+'" fill="none" stroke="var(--line-soft)" stroke-width="1"/>'; } }
      s+='<polygon points="'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ')+'" fill="'+(o.fill?'var(--accent)':'none')+'" opacity="'+(o.fill?0.2:1)+'" stroke="'+(o.col||'var(--accent)')+'" stroke-width="2" stroke-linejoin="round"/>';
      if(o.dots) pts.forEach(function(p){ s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="var(--white)" stroke="'+(o.col||'var(--accent)')+'" stroke-width="2"/>'; });
    }
    if(o.centerDot) s+='<circle cx="'+cx+'" cy="'+cy+'" r="3" fill="'+(o.col||'var(--accent)')+'"/>';
    if(o.centerLabel) s+='<text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" font-size="9" font-weight="700" font-family="Montserrat,sans-serif" fill="var(--ink)">'+o.centerLabel+'</text>';
    return svWrap(size,size,s);
  }

  /* ---------- Линейная (мульти-серии) ---------- */
  function bLC(series, o){
    o=o||{};
    var W=o.W||320, H=o.H||150, x0=o.x0!=null?o.x0:20, x1=o.x1!=null?o.x1:W-20;
    var yT=o.yT!=null?o.yT:18, yB=o.yB!=null?o.yB:H-24;
    var mn=o.mn!=null?o.mn:0, mx=o.mx!=null?o.mx:100;
    function X(i,n){ return x0+i*(x1-x0)/Math.max(1,n-1); }
    function Y(v){ return yB-(v-mn)/(mx-mn)*(yB-yT); }
    var s='';
    if(o.zone){ s+='<rect x="'+x0+'" y="'+Y(o.zone[1]).toFixed(1)+'" width="'+(x1-x0)+'" height="'+(Y(o.zone[0])-Y(o.zone[1])).toFixed(1)+'" fill="'+(o.zone[2]||'var(--accent)')+'" opacity="'+(o.zone[3]!=null?o.zone[3]:0.12)+'"/>'; }
    if(o.bands){ for(var b2=0;b2<8;b2+=2){ s+='<rect x="'+X(b2,8).toFixed(1)+'" y="'+yT+'" width="'+(X(b2+1,8)-X(b2,8)).toFixed(1)+'" height="'+(yB-yT)+'" fill="var(--row)" opacity=".7"/>'; } }
    if(o.gridH!==false && !o.noGrid){ (o.gridH||[0,0.5,1]).forEach(function(f){ var gy=yB-f*(yB-yT); s+='<line x1="'+x0+'" y1="'+gy.toFixed(1)+'" x2="'+x1+'" y2="'+gy.toFixed(1)+'" stroke="var(--dash)" stroke-width="1" stroke-dasharray="3 4"/>'; }); }
    if(o.gridV){ for(var gv=0;gv<8;gv++){ s+='<line x1="'+X(gv,8).toFixed(1)+'" y1="'+yT+'" x2="'+X(gv,8).toFixed(1)+'" y2="'+yB+'" stroke="var(--line-soft)" stroke-width="1"/>'; } }
    (o.targets||[]).forEach(function(t2){
      var ty=Y(t2[0]);
      s+='<line x1="'+x0+'" y1="'+ty.toFixed(1)+'" x2="'+x1+'" y2="'+ty.toFixed(1)+'" stroke="'+(t2[1]||'var(--ink)')+'" stroke-width="1.5" stroke-dasharray="4 4"/>';
      if(t2[2]) s+='<text x="'+x1+'" y="'+(ty-4).toFixed(1)+'" text-anchor="end" font-size="8" fill="'+(t2[1]||'var(--ink)')+'">'+t2[2]+'</text>';
    });
    if(o.avg!=null){ var ay=Y(o.avg); s+='<line x1="'+x0+'" y1="'+ay.toFixed(1)+'" x2="'+x1+'" y2="'+ay.toFixed(1)+'" stroke="var(--sand)" stroke-width="2" stroke-dasharray="5 4"/>'; if(o.avgLbl) s+='<text x="'+(x0+2)+'" y="'+(ay-4).toFixed(1)+'" font-size="8" fill="var(--muted)">'+o.avgLbl+'</text>'; }
    if(o.trend!=null){ var tr=o.trend; s+='<line x1="'+X(0,8)+'" y1="'+Y(tr[0]).toFixed(1)+'" x2="'+X(7,8)+'" y2="'+Y(tr[1]).toFixed(1)+'" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="6 4"/>'; }
    if(o.vertToday!=null){ var vx=x0+o.vertToday*(x1-x0); s+='<line x1="'+vx.toFixed(1)+'" y1="'+yT+'" x2="'+vx.toFixed(1)+'" y2="'+yB+'" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="3 3"/>'; s+='<text x="'+vx.toFixed(1)+'" y="'+(yT-4)+'" text-anchor="middle" font-size="8" font-weight="600" fill="var(--ink)">сегодня</text>'; }
    series.forEach(function(sr){
      var n=sr.v.length, col=sr.col||'var(--accent)', w=sr.w||2, pts=sr.v.map(function(v,i){return X(i,n).toFixed(1)+','+Y(v).toFixed(1);});
      if(sr.smooth){
        var path=dSM(pts);
        if(sr.area) s+='<path d="'+path+' L'+X(n-1,n).toFixed(1)+' '+yB+' L'+X(0,n).toFixed(1)+' '+yB+' Z" fill="'+col+'" opacity="'+(sr.areaOp!=null?sr.areaOp:0.18)+'" stroke="none"/>';
        s+='<path d="'+path+'" fill="none" stroke="'+col+'" stroke-width="'+w+'" stroke-linecap="round"'+(sr.dash?' stroke-dasharray="'+sr.dash+'"':'')+'/>';
      } else if(sr.step){
        var d='M'+X(0,n).toFixed(1)+' '+Y(sr.v[0]).toFixed(1);
        for(var i=1;i<n;i++) d+=' H'+X(i,n).toFixed(1)+' V'+Y(sr.v[i]).toFixed(1);
        s+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="'+w+'" stroke-linejoin="round"/>';
      } else {
        if(sr.area) s+='<path d="M'+X(0,n).toFixed(1)+' '+yB+' L'+pts.join(' L')+' L'+X(n-1,n).toFixed(1)+' '+yB+' Z" fill="'+col+'" opacity="'+(sr.areaOp!=null?sr.areaOp:0.18)+'" stroke="none"/>';
        if(sr.glow) s+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+col+'" stroke-width="'+(w+7)+'" stroke-linecap="round" opacity=".15"/>';
        s+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+col+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round"'+(sr.dash?' stroke-dasharray="'+sr.dash+'"':'')+'"/>';
      }
      if(sr.dots || sr.dotsEvery || sr.dotsLast){
        for(var i=0;i<n;i++){
          if(sr.dotsEvery && i%sr.dotsEvery!==0 && !sr.dots) continue;
          if(sr.dotsLast && i!==n-1) continue;
          var p=pts[i].split(',');
          s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(sr.dotR||3.2)+'" fill="'+(sr.dotFill||'var(--white)')+'" stroke="'+col+'" stroke-width="2"/>';
        }
      }
      if(sr.endTag){ var p=pts[n-1].split(','); s+='<rect x="'+(+p[0]-17).toFixed(1)+'" y="'+(+p[1]-19).toFixed(1)+'" width="34" height="15" rx="7.5" fill="var(--ink)"/>'; s+='<text x="'+p[0]+'" y="'+(+p[1]-8).toFixed(1)+'" text-anchor="middle" font-size="8.5" font-weight="600" font-family="Montserrat,sans-serif" fill="var(--white)">'+sr.v[n-1]+'</text>'; }
      if(sr.calloutIdx!=null){ var ci=sr.calloutIdx, p=pts[ci].split(','); s+='<line x1="'+p[0]+'" y1="'+p[1]+'" x2="'+p[0]+'" y2="'+(yT+10)+'" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 3"/>'; s+='<text x="'+p[0]+'" y="'+(yT+7)+'" text-anchor="middle" font-size="7.5" fill="var(--muted)">'+(sr.calloutTxt||('нед '+(ci+1)))+'</text>'; }
      if(sr.endLbl){ var p=pts[n-1].split(','); s+='<text x="'+(+p[0]+6)+'" y="'+(+p[1]+3)+'" font-size="8" font-weight="600" fill="'+col+'">'+sr.endLbl+'</text>'; }
    });
    if(o.slopeArrow){ var last=series[0].v; s+='<text x="'+x1+'" y="'+(yB+14)+'" text-anchor="end" font-size="8.5" font-weight="600" font-family="Montserrat,sans-serif" fill="var(--accent)">'+o.slopeArrow+'</text>'; }
    if(o.xlbl!==false){ for(var i=0;i<8;i++) s+='<text x="'+X(i,8)+'" y="'+(H-8)+'" text-anchor="middle" font-size="8.5" fill="var(--muted)">'+(i+1)+'</text>'; }
    if(o.axisL){ (o.axisL||[mn,(mn+mx)/2,mx]).forEach(function(v){ s+='<text x="'+(x0-5)+'" y="'+(Y(v)+3).toFixed(1)+'" text-anchor="end" font-size="8" fill="var(--muted)">'+(typeof v==='number'&&v%1?v.toFixed(1):v)+'</text>'; }); }
    if(o.axisR){ (o.axisR||[]).forEach(function(v){ s+='<text x="'+(x1+5)+'" y="'+(Y(v)+3).toFixed(1)+'" font-size="8" fill="var(--muted)">'+v+'</text>'; }); }
    return svWrap(W,H,s);
  }

  /* ---------- Области (стек/поток/наложение) ---------- */
  function bAC(series, o){
    o=o||{};
    var W=320,H=150,x0=20,x1=300,yT=18,yB=124;
    function X(i){ return x0+i*(x1-x0)/7; }
    var totals=series[0].map(function(v,i){ var t=0; for(var k=0;k<series.length;k++) t+=series[k][i]; return t; });
    var mx=o.mx!=null?o.mx:Math.max.apply(null,totals);
    function Y(v){ return yB-(v/mx)*(yB-yT); }
    function band(lower,upper,col,op){
      var d='M'+X(0).toFixed(1)+' '+Y(lower[0]).toFixed(1);
      for(var i=1;i<8;i++) d+=' L'+X(i).toFixed(1)+' '+Y(lower[i]).toFixed(1);
      for(var i=7;i>=0;i--) d+=' L'+X(i).toFixed(1)+' '+Y(upper[i]).toFixed(1);
      return '<path d="'+d+' Z" fill="'+col+'" opacity="'+op+'" stroke="var(--white)" stroke-width=".5"/>';
    }
    var s='', cols=o.cols||['var(--accent-d)','var(--accent)','var(--sand)'];
    if(o.mode==='single'||o.mode==='overlap'){
      series.forEach(function(sr,k2){
        var pts=sr.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1);});
        s+='<path d="M'+X(0).toFixed(1)+' '+yB+' L'+pts.join(' L')+' L'+X(7).toFixed(1)+' '+yB+' Z" fill="'+(sr.col||cols[k2%3])+'" opacity="'+(sr.op!=null?sr.op:0.2)+'" stroke="none"/>';
        if(o.line) s+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+(sr.col||cols[k2%3])+'" stroke-width="1.8"/>';
      });
    } else {
      var midY=(yT+yB)/2, baseArr=[], cum=[];
      for(var i=0;i<8;i++){ cum[i]=0; baseArr[i]= o.mode==='stream'? midY-totals[i]/mx*(yB-yT)/2 : yB; }
      for(var k2=0;k2<series.length;k2++){
        var lower=cum.slice(), upper=cum.slice();
        for(var i=0;i<8;i++){
          upper[i]=cum[i]+series[k2][i];
          if(o.mode==='norm'){ lower[i]/=totals[i]; upper[i]/=totals[i]; }
        }
        var loArr= o.mode==='stream'? (k2===0? baseArr : lower.map(function(v,i){return baseArr[i]+v;})) : (o.mode==='norm'? lower : lower);
        var upArr= o.mode==='stream'? lower.map(function(v,i){return baseArr[i]+ (o.mode==='norm'? (upper[i]/totals[i])*totals[i] : upper[i]);}) : upper;
        if(o.mode==='norm'){ s+=band(lower.map(function(v){return v;}), upper.map(function(v){return v;}), cols[k2%3], 0.9); }
        else if(o.mode==='stream'){ s+=band(loArr, upArr, cols[k2%3], 0.9); }
        else s+=band(lower, upper, cols[k2%3], 0.85);
      }
    }
    for(var i=0;i<8;i++) s+='<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="8.5" fill="var(--muted)">'+(i+1)+'</text>';
    return svWrap(W,H,s);
  }

  /* ---------- Горизонтальные полосы ---------- */
  function bHB(vals, o){
    o=o||{};
    var W=o.W||320, rowH=o.rowH||20, top=o.top||12, H=top+vals.length*rowH+4;
    var x0=30, maxW=o.maxW!=null?o.maxW:230, s='';
    for(var i=0;i<vals.length;i++){
      var y=top+i*rowH, v=vals[i], scl=o.pct||100, w1=maxW*v/scl;
      if(o.dual){
        var v2=o.dual[i], w2=maxW*v2/(o.pct||100);
        s+='<rect x="'+x0+'" y="'+y+'" width="'+Math.max(2,w2).toFixed(1)+'" height="6" rx="3" fill="'+(o.dualCol||'var(--sand)')+'"/>';
        s+='<rect x="'+x0+'" y="'+(y+8)+'" width="'+Math.max(2,w1).toFixed(1)+'" height="6" rx="3" fill="var(--accent)"/>';
        s+='<text x="'+(x0+Math.max(2,w1)+6).toFixed(1)+'" y="'+(y+14)+'" font-size="8.5" font-weight="600" font-family="Montserrat,sans-serif" fill="var(--ink)">'+v+'</text>';
      } else if(o.stack){
        var rest=o.stack[i], ws=Math.max(2,w1), wr=Math.max(1.5, maxW*(rest/100));
        s+='<rect x="'+x0+'" y="'+y+'" width="'+ws.toFixed(1)+'" height="14" fill="var(--accent)"/>';
        s+='<rect x="'+(x0+ws).toFixed(1)+'" y="'+y+'" width="'+(wr).toFixed(1)+'" height="14" fill="var(--track)"/>';
        s+='<rect x="'+x0+'" y="'+y+'" width="'+(ws+wr).toFixed(1)+'" height="14" rx="7" fill="none" stroke="var(--line-soft)"/>';
        s+='<text x="'+(x0+ws+wr+6).toFixed(1)+'" y="'+(y+11)+'" font-size="8.5" font-weight="600" font-family="Montserrat,sans-serif" fill="var(--ink)">'+v+'/'+Math.round(v+rest)+'</text>';
      } else if(o.cells){
        var nc=o.cells, cnt=Math.round(v/100*nc);
        for(var k=0;k<nc;k++) s+='<circle cx="'+(x0+8+k*(maxW/nc))+'" cy="'+(y+9)+'" r="5" fill="'+(k<cnt?'var(--accent)':'var(--track)')+'"/>';
        s+='<text x="'+(x0+maxW+8)+'" y="'+(y+12)+'" font-size="8.5" font-weight="600" font-family="Montserrat,sans-serif" fill="var(--ink)">'+v+'%</text>';

  /* ---------- Потоки (на данных DHABPCT) ---------- */

  /* ---------- Пиктограммы (человечки) ---------- */
  function dFig(x,y,fill,op){ return '<g transform="translate('+x+','+y+')" fill="'+fill+'" opacity="'+op+'"><circle cx="8" cy="3.4" r="3.2"/><path d="M8 7C4.4 8 3.6 11.2 3.9 14.2c0.08 0.9 0.75 1.5 1.65 1.5h6.9c0.9 0 1.57-0.6 1.65-1.5C14.4 11.2 13.6 8 10 7z"/></g>'; }
  function bPict(vals, o){
    o=o||{};

    if(o.mode==='vs'){
      var n=vals.length;
      vals.forEach(function(v,i){
        var y=26+i*18;
        var filled=Math.round(v/100*(o.figN||10));
        for(var k=0;k<(o.figN||10);k++) s+=dFig(30+k*22, y, 'var(--accent)', k<filled?1:0.15);
        s+='<text x="10" y="'+(y+10)+'" font-size="9" fill="var(--muted)">'+(i+1)+'</text>';
        s+='<text x="'+(30+(o.figN||10)*22+8)+'" y="'+(y+10)+'" font-size="9.5" font-weight="600" font-family="Montserrat,sans-serif" fill="var(--ink)">'+v+'%</text>';
      });

    if(o.mode==='grid'){
      for(var i=0;i<56;i++){

      for(var c=0;c<8;c++) s+='<text x="'+(20+c*39+8)+'" y="156" text-anchor="middle" font-size="8.5" fill="var(--muted)">'+(c+1)+'</text>';
      return svWrap(W,166,s);
    }
    if(o.mode==='row'){
      var total=vals.reduce(function(a,b){return a+b;},0), mx=total||1;
      vals.forEach(function(v,i){
        var cnt=1+Math.round(v/mx*(o.figN||6)-1);

    return svWrap(W, 90, s);
  }

function renderDay(a){
  var d = state.days[a];
  var s = dayStats(a);
  var w = weekOfAbs(a);
  var dayDone = s.non>0 && s.pct===100;

  var h='';
  h += '<div class="card">'
     + '<div class="dayhead">'
     + '<div><b>'+dayFull(a)+'</b><div class="dh-sub">'+fmtDayYear(a)+' · неделя '+(w+1)+' из '+WEEKS+'</div>'
     + (dayDone? '<div class="dh-done">День выполнен</div>':'')
     + '</div>'
     + '<div class="ring-dh">'+ringHTML(s.pct,52,5,11)+'</div>'
     + '</div></div>';


  h += '<div class="dgrid">';
  h += '<div class="dcol-main">';

  var tasksH='';
  for(var k=0;k<d.tasks.length;k++){
    var tk = d.tasks[k];
    tasksH += '<div class="task'+(tk.done?' done':'')+'" data-ki="'+k+'">'
      + '<button class="chk'+(tk.done?' on':'')+'" type="button" data-loc="d'+a+'t'+k+'c" aria-label="готово">'
      + '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg></button>'
      + '<input class="task-in" data-loc="d'+a+'t'+k+'" value="'+esc(tk.t)+'" placeholder="Задача '+(k+1)+'">'
      + '<button class="rmbtn no-print" type="button" data-loc="d'+a+'t'+k+'x" aria-label="удалить">×</button>'
      + '</div>';
  }
  h += '<div class="card">'
     + '<div class="section-head"><span class="sh-ic">'+ic('tasks')+'</span>Задачи дня<span class="sh-badge" id="taskBadge">'+s.done+'/'+s.non+'</span></div>'
     + '<div class="tasks-list">'+tasksH+'</div>'
     + '<button class="addbtn no-print" type="button" data-add="task:'+a+'">'+ic('plus',14)+'<span>Добавить задачу</span></button>'
     + '</div>';

  h += '</div>'; /* dcol-main */

  h += '<div class="dcol-side">';

  var habsH='';
  for(var hk=0;hk<state.habits.length;hk++){
    var hb = state.habits[hk];
    habsH += '<div class="hab-day">'
      + '<button class="hchk'+(hb.days[a]?' on':'')+'" type="button" data-loc="h'+hk+'d'+a+'" aria-label="привычка выполнена">'
      + '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg></button>'
      + '<input class="hab-name" data-loc="h'+hk+'n" value="'+esc(hb.name)+'" placeholder="Название привычки">'
      + '<button class="rmbtn no-print" type="button" data-loc="h'+hk+'x" aria-label="удалить">×</button>'
      + '</div>';
  }
  h += '<div class="card">'
     + '<div class="section-head"><span class="sh-ic">'+ic('repeat')+'</span>Трекер привычек<span class="sh-badge" id="habBadge">'+state.habits.filter(function(x){return x.days[a];}).length+'/'+state.habits.length+'</span></div>'
     + '<div class="habs-list">'+habsH+'</div>'
     + '<button class="addbtn no-print" type="button" data-add="habit">'+ic('plus',14)+'<span>Добавить привычку</span></button>'
     + '</div>';

  h += '<div class="card">'
     + '<div class="section-head"><span class="sh-ic">'+ic('sun')+'</span>Как прошёл день</div>'
     + '<div class="tracker-row"><span class="tl">'+ic('moon',15)+'Сон</span><span class="sleep-wrap"><input type="number" inputmode="decimal" step="0.5" min="0" max="15" data-loc="d'+a+'sl" value="'+esc(d.sleep)+'" placeholder="8" aria-label="часы сна"><i>ч</i></span></div>'
     + '<div class="tracker-row"><span class="tl">'+ic('bolt',15)+'<input class="tl-in" data-loc="tn_energy" value="'+esc(state.trackNames.energy)+'" maxlength="20" autocomplete="off" aria-label="Название трекера"></span>'+starPicker('d'+a+'e', d.energy)+'</div>'
     + '<div class="tracker-row"><span class="tl">'+ic('smile',15)+'<input class="tl-in" data-loc="tn_mood" value="'+esc(state.trackNames.mood)+'" maxlength="20" autocomplete="off" aria-label="Название трекера"></span>'+starPicker('d'+a+'m', d.mood)+'</div>'
     + '</div>';

  h += '</div>'; /* dcol-side */

  h += '<div class="card">'
    + '<div class="section-head"><span class="sh-ic">'+ic('book')+'</span>Дневник</div>'

    + '<div class="jf"><label>Благодарность</label><textarea data-loc="d'+a+'thk" rows="2" placeholder="За что благодарен(на)">'+esc(d.thanks)+'</textarea></div>'
    + '<div class="jf jf-wide"><label>Мысли и идеи на следующие дни</label><textarea data-loc="d'+a+'tho" rows="3" placeholder="Мысли, идеи, заметки">'+esc(d.thoughts)+'</textarea></div>'

function updateDayDerived(a){
  var s = dayStats(a);
  function set(id, v){ var el=document.getElementById(id); if(el) el.textContent=v; }
  set('taskBadge', s.done+'/'+s.non);
  set('habBadge', state.habits.filter(function(x){return x.days[a];}).length+'/'+state.habits.length);
  var head=document.querySelector('#v-day .dayhead .ring-dh');
  if(head) head.innerHTML = ringHTML(s.pct,52,5,11);
  document.querySelectorAll('#v-day .task').forEach(function(row){
    var ki = +row.getAttribute('data-ki');
    var tk = state.days[a].tasks[ki];
    if(tk) row.classList.toggle('done', !!tk.done);
  });
}

/* ================= действия ================= */
function doAdd(kind){
  var parts = kind.split(':');
  var type = parts[0], a = +parts[1];
  if(type==='task'){
    if(state.days[a].tasks.length>=MAX_TASKS){ toast('Максимум '+MAX_TASKS+' задач на день'); return; }
    state.days[a].tasks.push(emptyTask());
    window._flashKi = state.days[a].tasks.length-1;
    save(); renderDay(a);
    var last = document.querySelectorAll('#v-day .task-in');
    if(last.length) last[last.length-1].focus();
    return;
  }
  if(type==='habit'){
    if(state.habits.length>=MAX_HABITS){ toast('Максимум '+MAX_HABITS+' привычек'); return; }
    var arr=[]; for(var z=0;z<WEEKS*7;z++) arr.push(false);
    state.habits.push({name:'', days:arr});
    save();
    if(curView==='sp') renderSprint(); else renderDay(state.activeWeek*7 + +curView.charAt(1));
    var all = document.querySelectorAll('#v-day .hab-name');
    if(all.length) all[all.length-1].focus();
    return;
  }
}
function doRemove(loc){
  var m;
  if((m=loc.match(/^d(\d+)t(\d+)x$/))){
    var i=+m[1], k=+m[2], t=state.days[i].tasks[k];
    if(String(t.t).trim() && !confirm('Удалить задачу?')) return;
    state.days[i].tasks.splice(k,1);
    save(); renderDay(i); buildNav(); return;
  }
  if((m=loc.match(/^h(\d+)x$/))){
    var hk=+m[1], hb=state.habits[hk];
    var used=hb.days.some(Boolean);
    if((String(hb.name).trim()||used) && !confirm('Удалить привычку?')) return;
    state.habits.splice(hk,1);
    if(!state.habits.length){
      var arr=[]; for(var z=0;z<WEEKS*7;z++) arr.push(false);
      state.habits.push({name:'',days:arr});
    }
    save(); buildNav(); if(curView==='sp') renderSprint(); else renderDay(state.activeWeek*7 + +curView.charAt(1));
    return;
  }

}

/* ================= события ================= */
document.addEventListener('input', function(e){
  var el = e.target;
  if(!el || !el.dataset || !el.dataset.loc) return;
  var loc = el.dataset.loc, v = el.value;
  var m;
  if(loc==='goal'){ state.goal = v; }
  else if(loc==='tools'){ state.tools = v; }
  else if(loc==='rt_good'){ state.retro.good = v; }
  else if(loc==='rt_bad'){ state.retro.bad = v; }
  else if(loc==='rt_next'){ state.retro.next = v; }
  else if((m=loc.match(/^d(\d+)t(\d+)$/))){ state.days[+m[1]].tasks[+m[2]].t = v; }
  else if((m=loc.match(/^d(\d+)sl$/))){ state.days[+m[1]].sleep = v; }
  else if((m=loc.match(/^d(\d+)(wi|thk|tho)$/))){
    var f={'wi':'wisdom','thk':'thanks','tho':'thoughts'};
    state.days[+m[1]][f[m[2]]] = v;
  }
  else if((m=loc.match(/^h(\d+)n$/))){ state.habits[+m[1]].name = v; }
  else if(loc==='tn_energy'){ state.trackNames.energy = v; }
  else if(loc==='tn_mood'){ state.trackNames.mood = v; }
  else return;
  save();
  if(curView!=='sp') updateDayDerived(state.activeWeek*7 + +curView.charAt(1));
});

function haptic(kind){
  try{
    var tg = window.Telegram && window.Telegram.WebApp;
    if(tg && tg.HapticFeedback){
      if(kind==='success') tg.HapticFeedback.notificationOccurred('success');
      else tg.HapticFeedback.impactOccurred(kind||'light');
    }
  }catch(e){}
}

document.addEventListener('click', function(e){
  var t = e.target;
  if(!t || !t.closest) return;

  var tab = t.closest('.nav .tab');
  if(tab){ setView(tab.getAttribute('data-view')); return; }

  var wk = t.closest('.wk');
  if(wk){ setActiveWeek(+wk.getAttribute('data-w')); return; }

  var dl = t.closest('[data-print]');
  if(dl){ printSection(dl.getAttribute('data-print')); return; }

  var add = t.closest('[data-add]');
  if(add){ doAdd(add.getAttribute('data-add')); return; }

  var act = t.closest('[data-act]');
  if(act){
    var av = act.getAttribute('data-act');
    if(av==='finish'){
      if(confirm('Завершить спринт?\n\nНа вкладке «Главная» появится блок «Итоги спринта».')){
        state.finished = 'pending';
        save();
        setView('sp');
        toast('Спринт завершён — подведите итоги');
        var fEl = document.querySelector('.fin-card');
        if(fEl && fEl.scrollIntoView) fEl.scrollIntoView({behavior:'smooth', block:'start'});
      }
      return;
    }
    if(av==='vd-done'){ state.finished = 'done'; save(); renderSprint(); return; }
    if(av==='vd-not'){ state.finished = 'not'; save(); renderSprint(); return; }
    return;
  }

  var rm = t.closest('.rmbtn');
  if(rm){ doRemove(rm.dataset.loc); return; }

  var chk = t.closest('.chk, .hchk');
  if(chk){
    var loc = chk.dataset.loc;
    var on = !chk.classList.contains('on');
    chk.classList.toggle('on', on);
    haptic('light');
    var m;
    if((m=loc.match(/^d(\d+)t(\d+)c$/))){
      state.days[+m[1]].tasks[+m[2]].done = on;
      document.querySelectorAll('#v-day .task[data-ki="'+m[2]+'"]').forEach(function(r){ r.classList.toggle('done', on); });
      save(); updateDayDerived(state.activeWeek*7 + +curView.charAt(1));
      buildNav();
      updateFinishBtn();
      if(on && (+m[1])%7===6){
        var wu = weekOfAbs(+m[1]);
        if(wu+1 <= WEEKS-1 && wu+1 > state.maxUnlocked){
          state.maxUnlocked = wu+1;
          save();
          buildWeekPills();
          if(curView==='sp') renderSprint();
          toast('Неделя '+(wu+2)+' открыта — так держать!');
        }
      }
    } else if((m=loc.match(/^h(\d+)d(\d+)$/))){
      state.habits[+m[1]].days[+m[2]] = on;
      var a=+m[2];
      document.querySelectorAll('.hchk[data-loc="'+loc+'"]').forEach(function(n){ n.classList.toggle('on', on); });
      save(); buildNav(); if(curView==='sp') renderSprint(); else updateDayDerived(a);
    }
    return;
  }

  var star = t.closest('.stars button');
  if(star){
    var sloc = star.dataset.loc;
    var sm = sloc.match(/^d(\d+)([em])(\d)$/);
    if(sm){
      var di=+sm[1], key = sm[2]==='e'?'energy':'mood', k=+sm[3];
      var nv = state.days[di][key]===k ? 0 : k;
      state.days[di][key] = nv;
      haptic('light');
      save();
      var cont = star.parentElement;
      if(cont && cont.querySelectorAll){
        cont.querySelectorAll('button').forEach(function(b, bi){
          b.classList.toggle('on', bi < nv);
        });
        cont.setAttribute('aria-valuenow', String(nv));
      }
      if(curView==='d'+(di%7)) updateDayDerived(di);
    }
    return;
  }
});

/* ---------- свайп между днями (в пределах недели) ---------- */
(function(){
  var panel = document.getElementById('v-day');
  var sx=0, sy=0, tracking=false;
  panel.addEventListener('pointerdown', function(e){
    if(e.target.closest('input,textarea,button')) return;
    if(curView==='sp') return;
    tracking=true; sx=e.clientX; sy=e.clientY;
  });
  panel.addEventListener('pointerup', function(e){
    if(!tracking) return; tracking=false;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if(Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy)*1.3) return;
    var i = +curView.charAt(1);
    var n = dx < 0 ? Math.min(6, i+1) : Math.max(0, i-1);
    setView('d'+n);
  });
  panel.addEventListener('pointercancel', function(){ tracking=false; });
})();

/* ---------- новый спринт ---------- */
function startNewSprint(){
  if(!confirm('Начать новый спринт?\n\nДанные текущего спринта (цель, инструменты, задачи, привычки, дневник) будут очищены. Имена привычек сохранятся.\n\nНовый спринт начнётся завтра: ' + fmtShort(addDaysISO(todayISO(),1)) + '.\n\nСовет: сначала скачайте текущий спринт в PDF (кнопка «Скачать» на главной странице).')) return;
  state.sprintStart = addDaysISO(todayISO(), 1);
  state.goal = '';
  state.tools = '';
  state.finished = null;
  state.retro = {good:'',bad:'',next:''};
  var days=[];
  for(var a=0;a<WEEKS*7;a++) days.push(defDay());
  state.days = days;
  state.habits = state.habits.map(function(hb){
    var arr=[]; for(var z=0;z<WEEKS*7;z++) arr.push(false);
    return {name:hb.name, days:arr};
  });
  state.maxUnlocked = 0;
  state.activeWeek = 0;
  save();
  document.getElementById('dateInput').value = state.sprintStart;
  document.getElementById('weekLabel').textContent = sprintRangeLabel();
  buildNav();
  buildWeekPills();
  setView('sp');
  haptic('success');
  toast('Новый спринт начат: ' + fmtShort(state.sprintStart));
}
document.getElementById('btnNew').addEventListener('click', startNewSprint);

/* ---------- дата начала спринта ---------- */
document.getElementById('dateInput').addEventListener('change', function(e){
  if(!e.target.value) return;
  state.sprintStart = e.target.value;
  if(state.activeWeek>state.maxUnlocked) state.activeWeek=state.maxUnlocked;
  save();
  document.getElementById('weekLabel').textContent = sprintRangeLabel();
  buildNav();
  buildWeekPills();
  if(curView==='sp') renderSprint(); else renderDay(state.activeWeek*7 + +curView.charAt(1));
});

/* ---------- печать / PDF ---------- */
function printSection(kind){
  document.body.setAttribute('data-print', kind);
  window.addEventListener('afterprint', function f(){
    document.body.removeAttribute('data-print');
    window.removeEventListener('afterprint', f);
  });
  setTimeout(function(){ window.print(); }, 80);
  setTimeout(function(){ document.body.removeAttribute('data-print'); }, 4000);
}

/* ---------- тост ---------- */
var toastEl = document.getElementById('toast');
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(function(){ toastEl.classList.remove('show'); }, 2400);
}

try{

    var tg = window.Telegram.WebApp;
    tg.ready(); tg.expand();
    try{ tg.setHeaderColor('#F7F7F7'); }catch(e2){}
  }
}catch(e){}

/* ---------- старт ---------- */
buildNav();
buildWeekPills();
document.getElementById('dateInput').value = state.sprintStart;
document.getElementById('weekLabel').textContent = sprintRangeLabel();
