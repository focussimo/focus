<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Нумерологический калькулятор Анаэль</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Slab:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#d4af37;
  --gold-light:#f4e5b1;
  --gold-dark:#8b6914;
  --maroon:#4a0e0e;
  --maroon-deep:#2a0505;
  --saffron:#ff9933;
  --cream:#fdf6e3;
  --accent:#ff6b35;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--maroon-deep);color:var(--cream);font-family:'Roboto',sans-serif;min-height:100%}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at 20% 10%, rgba(212,175,55,0.08), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(255,107,53,0.06), transparent 45%),
    repeating-conic-gradient(from 0deg at 50% 50%, rgba(212,175,55,0.03) 0deg 15deg, transparent 15deg 30deg);
}
.app{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:20px 16px 100px}
header{text-align:center;padding:10px 0 4px}
h1{
  font-family:'Roboto Slab',serif;font-weight:700;font-size:26px;
  text-transform:uppercase;letter-spacing:1.5px;color:var(--gold-light);
  text-align:center;line-height:1.25;
}
.subtitle{
  font-family:'Roboto Slab',serif;font-weight:400;font-size:13px;
  letter-spacing:2px;color:var(--gold);opacity:.9;text-align:center;margin-top:6px;
}
.divider{
  height:1px;margin:20px 0;position:relative;background:linear-gradient(90deg,transparent,var(--gold),transparent);
  display:flex;justify-content:center;align-items:center;top:-10px;
}
.divider span{
  background:var(--maroon-deep);padding:0 10px;font-size:12px;color:var(--gold);line-height:1;
}
.form-card{
  position:relative;
  background:linear-gradient(145deg, rgba(74,14,14,0.9), rgba(42,5,5,0.95));
  border:1px solid var(--gold-dark);border-radius:16px;padding:22px 18px;margin-bottom:22px;
  box-shadow:0 8px 32px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(212,175,55,0.1);
}
.form-card::before{
  content:'';position:absolute;inset:6px;border:1px solid rgba(212,175,55,0.2);
  border-radius:12px;pointer-events:none;
}
.form-card label{
  display:block;font-family:'Roboto',sans-serif;font-weight:600;font-size:12px;
  letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:6px;
}
.form-card input, .form-card select{
  width:100%;background:rgba(0,0,0,0.35);
  border:1px solid rgba(212,175,55,0.35);border-radius:8px;
  padding:12px 14px;color:var(--cream);font-family:'Roboto',sans-serif;font-size:16px;
  margin-bottom:16px;outline:none;transition:.25s ease;
  -webkit-appearance:none;appearance:none;
}
.form-card select{background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.form-card input:focus, .form-card select:focus{
  border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,0.15);
}
.date-row{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px;margin-bottom:16px}
.date-row input{margin-bottom:0}
.btn{
  width:100%;background:linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-dark));
  color:var(--maroon-deep);border:none;border-radius:10px;padding:14px;
  font-family:'Roboto Slab',serif;font-weight:700;font-size:15px;
  text-transform:uppercase;letter-spacing:2px;cursor:pointer;
  box-shadow:0 4px 16px rgba(212,175,55,0.35);transition:.25s ease;
}
.btn:hover{box-shadow:0 6px 24px rgba(212,175,55,0.55)}
.btn:active{transform:scale(0.97)}
.loading{display:none;text-align:center;padding:40px 0;font-family:'Roboto Slab',serif;font-weight:500;color:var(--gold);letter-spacing:2px}
.loading.show{display:block}
.spinner{width:40px;height:40px;border:3px solid rgba(212,175,55,0.2);border-top-color:var(--gold);border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes resetIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
#results{display:none}
#results.show{display:block;animation:fadeIn .45s ease}
.numbers-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.num-badge{
  background:radial-gradient(circle at 50% 30%, rgba(212,175,55,0.18), rgba(74,14,14,0.85));
  border:1px solid var(--gold-dark);border-radius:12px;padding:14px 6px;text-align:center;
}
.num-badge .label{font-family:'Roboto Slab',serif;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--gold)}
.num-badge .value{font-family:'Roboto Slab',serif;font-weight:700;font-size:38px;color:var(--gold-light);text-shadow:0 0 15px rgba(212,175,55,0.5);line-height:1.1;margin-top:2px}
.num-badge .planet{font-family:'Roboto',sans-serif;font-size:10px;font-style:italic;color:var(--saffron);margin-top:4px}
.section{
  background:linear-gradient(160deg, rgba(74,14,14,0.85), rgba(42,5,5,0.9));
  border:1px solid var(--gold-dark);border-radius:14px;margin-bottom:16px;overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,0.4);
}
.section-header{
  padding:14px 18px;background:linear-gradient(90deg, rgba(212,175,55,0.12), transparent);
  border-bottom:1px solid rgba(212,175,55,0.2);display:flex;justify-content:space-between;align-items:center;
  cursor:pointer;user-select:none;
}
.section-header h2{
  font-family:'Roboto Slab',serif;font-weight:600;font-size:15px;text-transform:uppercase;
  letter-spacing:1px;color:var(--gold-light);display:flex;gap:8px;align-items:center;
}
.section-header .icon{font-size:16px;color:var(--gold)}
.section-header .chev{font-size:14px;color:var(--gold);transition:.3s ease;transform:rotate(0deg)}
.section.open .section-header .chev{transform:rotate(180deg)}
.section-body{max-height:0;overflow:hidden;transition:max-height .5s ease}
.section.open .section-body{max-height:20000px}
.section-inner{padding:16px 18px 20px}
.section-inner p{
  font-family:'Roboto',sans-serif;font-weight:400;font-size:15px;line-height:1.7;
  color:var(--cream);text-align:justify;margin-bottom:12px;
}
.section-inner p:last-child{margin-bottom:0}
.section-inner strong{font-family:'Roboto Slab',serif;font-weight:600;color:var(--gold-light)}
.section-inner em{color:var(--saffron);font-style:italic}
.block-title{
  font-family:'Roboto Slab',serif;font-weight:600;font-size:12px;text-transform:uppercase;
  letter-spacing:1.5px;color:var(--gold);margin:16px 0 8px;padding-bottom:6px;
  border-bottom:1px solid rgba(212,175,55,0.25);
}
.block-title:first-child{margin-top:0}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tag{
  background:rgba(212,175,55,0.15);border:1px solid rgba(212,175,55,0.4);border-radius:20px;
  padding:4px 10px;font-family:'Roboto',sans-serif;font-size:12px;color:var(--gold-light);letter-spacing:.5px;
}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.info-cell{background:rgba(0,0,0,0.3);border-left:3px solid var(--gold);padding:8px 12px;border-radius:4px}
.info-cell .k{font-family:'Roboto Slab',serif;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--gold)}
.info-cell .v{font-family:'Roboto',sans-serif;font-weight:500;font-size:14px;color:var(--cream);margin-top:2px}
.mantra{
  background:rgba(0,0,0,0.4);border:1px dashed var(--gold-dark);border-radius:8px;padding:12px;
  text-align:center;font-family:'Roboto Slab',serif;font-weight:500;font-size:14px;
  color:var(--gold-light);letter-spacing:1px;margin-top:10px;line-height:1.6;
}
.warning{
  background:rgba(255,107,53,0.1);border:1px solid rgba(255,107,53,0.4);border-radius:8px;
  padding:12px 14px;margin-top:12px;font-family:'Roboto',sans-serif;font-size:14px;line-height:1.6;color:var(--cream);
}
.warning::before{content:'⚠ ';color:var(--accent);font-weight:700}
.reset-btn{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:50;
  padding:13px 30px;background:linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-dark));
  color:var(--maroon-deep);border:1px solid var(--gold-light);border-radius:30px;
  font-family:'Roboto Slab',serif;font-weight:700;font-size:13px;
  text-transform:uppercase;letter-spacing:1.5px;cursor:pointer;
  box-shadow:0 6px 24px rgba(0,0,0,0.6), 0 0 20px rgba(212,175,55,0.4);
  display:none;transition:.25s ease;
}
.reset-btn.show{display:block;animation:resetIn .4s ease}
.reset-btn:active{transform:translateX(-50%) scale(0.95)}
.cell-block{margin-bottom:16px}
.cell-block h3{
  font-family:'Roboto Slab',serif;font-weight:600;font-size:13px;color:var(--gold-light);
  margin-bottom:6px;letter-spacing:.5px;
}
.cell-block p{font-size:14px;margin-bottom:6px}
.compat-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.compat-cell{background:rgba(0,0,0,0.3);border-left:3px solid var(--gold);padding:8px 12px;border-radius:4px}
.compat-cell .k{font-family:'Roboto Slab',serif;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--gold)}
.compat-cell .v{font-family:'Roboto',sans-serif;font-weight:500;font-size:13px;color:var(--cream);margin-top:2px;line-height:1.5}
@media (max-width:400px){
  h1{font-size:21px}
  .num-badge .value{font-size:32px}
  .info-grid{grid-template-columns:1fr}
  .compat-row{grid-template-columns:1fr}
  .date-row{grid-template-columns:1fr 1fr 1.6fr}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Нумерологический калькулятор</h1>
    <div class="subtitle">Система Анаэль · Матрица судьбы · Квадрат Пифагора</div>
  </header>
  <div class="divider"><span>❖</span></div>

  <div class="form-card" id="formCard">
    <label>Дата рождения</label>
    <div class="date-row">
      <input type="number" id="day" placeholder="День" min="1" max="31">
      <input type="number" id="month" placeholder="Месяц" min="1" max="12">
      <input type="number" id="year" placeholder="Год" min="1900" max="2100">
    </div>
    <label>Имя</label>
    <input type="text" id="firstName" placeholder="Имя" autocomplete="off">
    <label>Фамилия (для женщин — девичья)</label>
    <input type="text" id="surname" placeholder="Фамилия" autocomplete="off">
    <label>Отчество</label>
    <input type="text" id="patronymic" placeholder="Отчество" autocomplete="off">
    <label>Имя отца</label>
    <input type="text" id="fatherName" placeholder="Имя отца" autocomplete="off">
    <label>Пол</label>
    <select id="gender">
      <option value="female">Женский</option>
      <option value="male">Мужской</option>
    </select>
    <button class="btn" id="calcBtn">Рассчитать</button>
  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    Составляю матрицу…
  </div>

  <div id="results"></div>
</div>

<button class="reset-btn" id="resetBtn">Новый расчёт</button>

<script>
(function(){
'use strict';

/* ========== TELEGRAM ========== */
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor?.('#2a0505');
  tg.setBackgroundColor?.('#2a0505');
}
function notify(msg){
  if (tg && typeof tg.showAlert === 'function') tg.showAlert(msg);
  else alert(msg);
}

/* ========== СПРАВОЧНИКИ ========== */
const LV = {
  'А':1,'Б':2,'В':3,'Г':4,'Д':5,'Е':6,'Ё':7,'Ж':8,'З':9,
  'И':1,'Й':2,'К':3,'Л':4,'М':5,'Н':6,'О':7,'П':8,'Р':9,
  'С':1,'Т':2,'У':3,'Ф':4,'Х':5,'Ц':6,'Ч':7,'Ш':8,'Щ':9,
  'Ъ':1,'Ы':2,'Ь':3,'Э':4,'Ю':5,'Я':6
};
const VOWELS = 'АЕЁИОУЫЭЮЯ';
const PLANETS = {
  1:'Солнце',2:'Луна',3:'Юпитер',4:'Уран',5:'Меркурий',
  6:'Венера',7:'Нептун',8:'Сатурн',9:'Марс'
};

/* ========== УТИЛИТЫ ========== */
function reduce9(n){ n=Math.abs(n); while(n>9) n=String(n).split('').reduce((a,b)=>a+ +b,0); return n; }
function reduce22(n){ n=Math.abs(n); while(n>22) n=String(n).split('').reduce((a,b)=>a+ +b,0); return n; }
function digitsSum(n){ return String(Math.abs(n)).split('').reduce((a,b)=>a+ +b,0); }
function sumLetters(word){
  let s=0;
  for(const ch of String(word||'').toUpperCase()) if(LV[ch]) s+=LV[ch];
  return s;
}
function sumVowels(word){
  let s=0;
  for(const ch of String(word||'').toUpperCase()) if(VOWELS.includes(ch)&&LV[ch]) s+=LV[ch];
  return s;
}
function sumConsonants(word){
  let s=0;
  for(const ch of String(word||'').toUpperCase()) if(!VOWELS.includes(ch)&&LV[ch]) s+=LV[ch];
  return s;
}
function keepMaster(n){
  n=Math.abs(n);
  while(n>33) n=digitsSum(n);
  if(n===11||n===22||n===33) return n;
  while(n>9) n=digitsSum(n);
  return n;
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ========== РАСЧЁТЫ ========== */

// Число работы — сумма всех цифр даты рождения, свести к 1–9
function calcWorkNumber(d,m,y){
  return reduce9(d + m + y);
}

// Квадрат Пифагора
function calcPythagoras(d,m,y){
  const dateStr = String(d).padStart(2,'0') + String(m).padStart(2,'0') + String(y);
  const digits = dateStr.split('').map(Number);
  const n1 = digits.reduce((a,b)=>a+b,0);
  const n2 = digitsSum(n1);
  let firstDigit;
  const dayStr = String(d).padStart(2,'0');
  if(dayStr[0] === '0') firstDigit = Number(dayStr[1]);
  else firstDigit = Number(dayStr[0]);
  const n3 = n1 - 2*firstDigit;
  const n4 = digitsSum(n3);
  const all = [...digits, ...String(n1).split('').map(Number), ...String(n2).split('').map(Number), ...String(n3).split('').map(Number), ...String(n4).split('').map(Number)];
  const c = {};
  for(let i=1;i<=9;i++) c[i]=0;
  for(const x of all) if(x>=1&&x<=9) c[x]++;
  return {n1,n2,n3,n4,counts:c};
}

// Предназначение (день + месяц + год → 22)
function calcPredestination(d,m,y){
  const arcDay = reduce22(d);
  const arcMonth = reduce22(m);
  const arcYear = reduce22(digitsSum(y));
  const total = reduce22(arcDay + arcMonth + arcYear);
  return {arcDay, arcMonth, arcYear, total};
}

// Родовая программа
function calcClan(surname, gender){
  if(!surname) return null;
  const letters = String(surname).toUpperCase().replace(/[^А-ЯЁ]/g,'');
  if(!letters) return null;
  const raw = sumLetters(letters);
  const type = reduce22(raw);
  // Тип рода и талант — по мужской форме (для простоты используем ту же фамилию)
  let femaleTask = null;
  if(gender === 'female'){
    // Задача женщин — по женской форме. Если фамилия не меняется (несклоняемая),
    // прибавляем 1. Проверяем окончание.
    const last = letters.slice(-1);
    const isSklon = /[АЙЬЯ]$/.test(letters);
    let femaleNum;
    if(last === 'А' || last === 'Я') femaleNum = raw;
    else if(/[ЙЬ]$/.test(letters)) femaleNum = raw;
    else femaleNum = raw + 1;
    femaleTask = reduce22(femaleNum);
  }
  return {type, femaleTask, raw};
}

// Число Имени
function calcNameNumbers(first, surname, patronymic){
  const full = (first||'') + (surname||'') + (patronymic||'');
  const expr = keepMaster(sumLetters(full));
  const heart = keepMaster(sumVowels(full));
  const indiv = keepMaster(sumConsonants(full));
  return {expr, heart, indiv};
}

// Персональное число года
function calcPersonalYear(d,m,year){
  const y = reduce9(digitsSum(year));
  return reduce9(d + m + y);
}

// Финансовый прогноз
function calcFinance(d,m,y,fatherName,clientName,year){
  const code = d * m * y;
  let codeStr = String(code);
  if(codeStr.length === 5) codeStr += '0';
  if(codeStr.length < 6) return null;
  const fl = (fatherName||'').replace(/[^А-ЯЁа-яё]/g,'').length;
  const cl = (clientName||'').replace(/[^А-ЯЁа-яё]/g,'').length;
  const diff = fl - cl;
  const diffDigit = diff > 0 ? diff : 0;
  const yNum = reduce9(digitsSum(year));
  // 7 цифр: code (6) + diffDigit
  const seven = codeStr.split('').map(Number).concat([diffDigit]);
  const result = seven.map(x => reduce9(x + yNum));
  return {code:codeStr, diff:diffDigit, yearNum:yNum, months:result};
}

// Цвет удачи
function calcColor(day){
  const d = day;
  if([1,10,19,28].includes(d)) return {planet:'Солнце', colors:'Жёлтый, красный, коричневый, золотой, медный'};
  if([2,11,20,29].includes(d)) return {planet:'Луна', colors:'Белый, нежно-зелёный, кремовый, пастельный, оранжевый, синий'};
  if([3,12,21,30].includes(d)) return {planet:'Юпитер', colors:'Жёлтый, розовый, пурпурный, лиловый, тёмно-красный'};
  if([4,13,22,31].includes(d)) return {planet:'Раху', colors:'Светлые тона, синий, хаки, фиолетовый'};
  if([5,14,23].includes(d)) return {planet:'Меркурий', colors:'Коричневый, серый, белый'};
  if([6,15,24].includes(d)) return {planet:'Венера', colors:'Сияющий белый, голубой, жёлтый, синий'};
  if([7,16,25].includes(d)) return {planet:'Кету', colors:'Голубой, жёлтый, золотой, белый, пастельные'};
  if([8,17,26].includes(d)) return {planet:'Сатурн', colors:'Чёрный, тёмно-синий, серый, пурпурный'};
  if([9,18,27].includes(d)) return {planet:'Марс', colors:'Красный и его оттенки'};
  return {planet:'—', colors:'—'};
}

/* ========== ИНТЕРПРЕТАЦИИ ========== */

const WORK_NUMBERS = {
1:{title:'Число работы 1',text:'Вы реализуетесь в руководящей сфере, менеджменте, на управляющих позициях. Лидерство и возможность проявить индивидуальность — ваша стихия. Близки сферы развлечений и представлений, профессии дизайнера, преподавателя, механика, изобретателя. Подходит дело, где можно выразить своё «я». Достигаете успеха через новые проекты, где проявляется симбиоз оригинальности и умения руководить. Человек с вибрацией единицы почти на любой работе проявляет неординарное мышление и лидерские качества. Негативные качества: бесцеремонность, эгоизм, самодовольство, профессиональная деспотичность. Избегайте рутинной работы.'},
2:{title:'Число работы 2',text:'Вы достигнете успеха там, где не будет множества подчинённых. Вам лучше не занимать руководящие должности. Вы дипломатичны, чувствительны, умеете убеждать. Отлично ладите с людьми, можете объединить их для общей цели. Прекрасное применение — финансы: банковское дело, бухгалтерия, статистика. Из вас выйдет хороший советник, психолог, дипломат, воспитатель, секретарь. Важно быть причастным к общему делу. Стихия — командная работа. Негативные качества: робость, нерешительность, перфекционизм, зависимость от чужого мнения.'},
3:{title:'Число работы 3',text:'Лучший вариант — деятельность, связанная с искусством, публичностью. Три — число самовыражения. Вы творческий, эмоциональный человек с богатым воображением. Присмотритесь к сценическому искусству: ведущий, певец, актёр. Природа наделила вас даром слова. Подойдут журналистика, литературное творчество, работа с документами. Вы энергичны, оптимистичны, интеллектуальны. Негативные качества: нетерпеливость, многословие, резкая реакция на критику. Избегайте однообразной и скучной работы.'},
4:{title:'Число работы 4',text:'Вы практичны, осмысленны, постоянны. Остановитесь на профессии, требующей системы и порядка. Подвластны технология и методология — строительство, организация труда, операции с недвижимостью. Успех ждёт в науке, сельском хозяйстве. Вы бережно относитесь к имуществу и финансам — станете аккуратным кассиром, честным банкиром, бухгалтером. Надёжный деловой партнёр. Негативные качества: требовательность, властность, критичность. Избегайте авантюр и быстрой наживы.'},
5:{title:'Число работы 5',text:'Выбирайте занятость, подразумевающую свободу: путешествия, командировки. Рутина противопоказана. Лучше всего проявите себя в торговле, шоу-бизнесе, туризме, развлечениях. Можете стать публичной личностью — радиоведущим, лектором, писателем. Вы активны, милосердны, готовы помогать. Успех ждёт в законодательстве, детективной сфере, журналистике, преподавании. Вы способны влиять на людей. Негативные качества: безответственность, раздражительность, тщеславие, высокомерие.'},
6:{title:'Число работы 6',text:'Ищите профессии, связанные с гуманизмом и служением людям, семейными ценностями, комфортной жизнью. Вы можете найти себя в роли врача, учителя, повара, производителя одежды или игрушек. Подходят сферы, где сочетаются искусство и бытовая жизнь: обучение, педагогика, социология, психология, работа с детьми и животными, экология, биология, сельское хозяйство. Вы ответственный, организованный, добрый, чуткий. Негативные качества: требовательность, упрямство, обидчивость.'},
7:{title:'Число работы 7',text:'У вас классическое научное мышление: наблюдательность, аналитический склад ума, ничего не принимаете на веру. Подойдёт работа с самостоятельностью и минимальным контролем. Талант сопоставлять факты, строить логические цепочки — в научно-исследовательской работе, бизнесе с расчётами, литературной критике. Хорошая интуиция и эзотерическое понимание могут привести к духовному наставничеству. Негативные качества: скрытность, скептицизм, сложная адаптация к новому.'},
8:{title:'Число работы 8',text:'Любая организаторская работа — ваш вариант. Вы можете работать с финансами и недвижимостью, стоять во главе крупных проектов. Энергичность, трезвый взгляд, самообладание завоевывают авторитет. Вы доводите дела до конца, эффективны в кризисе. Хороший менеджер, директор, управляющий, судья, советник. Обратите внимание на финансовую сферу, биржи, инвестиции, капитальное строительство. Негативные качества: амбициозность, нетерпимость, злоупотребление властью, расточительность или скупость.'},
9:{title:'Число работы 9',text:'Вы филантроп и переживаете за человечество. Великодушие, чувствительность и сострадательность позволяют работать в сфере искусства или религии. Избегайте большого риска и ответственности. Подходит работа в общественной организации, связанная с путешествиями, командировками. Отлично вписываетесь в медицину, психологию. Тонко воспринимаете прекрасное — станете дизайнером или выйдете на сцену. Негативные качества: уныние, неуверенность, нерешительность.'}
};

const PREDESTINATION = {
1:{t:'Направлять и помогать словом, делать мир гармоничным, влиять на людей и вдохновлять. Ваше слово имеет силу. Вы — творец, новатор, можете создавать уникальное.',r:'Учитесь управлять силой разума и мысли, выработайте позитивное мышление. Обращайтесь умело со словом. Уделите внимание отношениям с братьями и сестрами. Медитируйте и молитесь.',o:'Используйте талант с благими намерениями. Верить в свои силы, уважать себя, но не быть высокомерным.'},
2:{t:'Проявить себя как мать — в широком смысле. Заботиться о других, принимать и утешать нуждающихся, поддерживать на старте, возвращать на путь заблудившихся.',r:'Быть искренними и решительными, доверять себе. Прислушивайтесь к импульсам изнутри, развивайте интуицию. Заботьтесь о теле. Наладьте отношения с матерью.',o:'Не отказывайтесь от женского начала. Постарайтесь открыться другим, преодолеть нерешительность и лень.'},

6:{t:'Открыть, показать миру любовь. Вы призваны демонстрировать истинное партнёрство, глубокие, высокие отношения. Женщинам — признать мужчину и отдать ему первенство. Мужчина берёт ответственность за семью.',r:'Сосредоточьтесь на позитивных качествах людей, откажитесь от осуждения. Принимайте мир целиком. Не бойтесь любить и проявлять чувства.',o:'Не допускайте легкомыслия, цинизма, измен, любовных треугольников, фальши — они уводят от предназначения.'},
7:{t:'Изменить мир собственными достижениями, успехами в карьере, получить признание. Вы — воин, победитель. Победы должны увидеть, результаты — приносить пользу.',r:'Заведите дневник целей и планов. Тщательно планируйте, потом свободно двигайтесь к целям. Рассказывайте о своей позиции и достижениях. Дерзайте, задавайте планку.',o:'Действуйте. Если сидите и ждёте — далеко не продвинетесь. Лень, праздность, хаотичность играют против вас.'},
8:{t:'Отстаивать правду, бороться за справедливость. Замечайте проблемы угнетённых, вставайте на защиту. Будьте честны с собой.',r:'Изучайте причинно-следственные связи и законы мироздания, развивайте интуицию. Относитесь к жизненным ситуациям как к урокам. Начните с честного отношения к себе.',o:'Остерегайтесь равнодушия, ожесточённого осуждения, расправ. Ваша задача — показать истину, рассудить по справедливости.'},
9:{t:'Прикоснуться к тайным знаниям и использовать их для помощи другим — особенно старшему поколению. Вы можете исцелять души, дарить надежду.',r:'Следите за речью: слова должны лечить, а не ранить. Записывайте мысли, но не уходите надолго в себя. Развивайте мысль и интуицию. Медитации.',o:'Ошибка — замкнуться, игнорировать источники знаний, не стремиться к духовному развитию.'},
10:{t:'На высоком уровне — очищение кармы и проработка кармических долгов. Заботиться о благополучии рода, семьи, приносить энергию потока, удачу в выбранное дело.',r:'Научитесь обращаться с энергией потока: чувствовать, входить, плыть. Работайте над пониманием денег. Возвысьте себя над бытовой суетой. Развивайтесь духовно и физически.',o:'Избегайте пассивности, не живите за чужой счёт, стремитесь действовать.'},
11:{t:'Стать лидером в избранной сфере. Вам дано идти впереди, вести за собой, вдохновлять. Реальный мир важен — в конкретных действиях и результатах заключено предназначение.',r:'Направляйте внутреннюю силу во благо, разрушительные эмоции превращайте в позитив. Цели — приносящие пользу многим. Будьте менее требовательны. Научитесь расслабляться.',o:'Нерешительность и бездействие, как и попытки навязать свои принципы силой, отбрасывают назад.'},
12:{t:'Духовный рост и обретение высшего «я». Служение людям через эмоциональный контакт с миром, изучение его во всём несовершенстве.',r:'Относитесь к себе с такой же любовью, как к другим. Выходите из неопределённости и инертности — фитнес, йога. Изучайте внутренний мир.',o:'Избегайте ненужной жертвенности, ухода от реальности, сосредоточенности только на себе.'},
13:{t:'Изменять, преобразовывать. Помощь людям в сложных ситуациях, когда вы выводите их на новую дорогу. Управлять переменами, разрушать неработающее и открывать новое.',r:'Научитесь чувствовать себя уверенно в любых ситуациях. Энергетические практики. Относитесь к себе бережно. Работайте над преодолением тормозящего. Учитесь управлять переменами.',o:'Оставаться в стороне от изменений — ошибка. Возглавьте их на благо окружающих.'},
14:{t:'Нести в мир красоту, гармонию, баланс, открывать прекрасное человечеству. Вам дано исцелять тела и души через творчество.',r:'Учитесь в простых вещах замечать прекрасное, рутину превращать в творчество. Движение к предназначению возможно в любом возрасте. Отдыхайте у воды или на природе. Медитации, йога, духовная литература.',o:'Эмоциональная неустойчивость, впадение в крайности, хаотичность мешают достичь гармонии.'},
15:{t:'Усмирять в себе и других пороки, освобождать и освобождаться от соблазнов. Вам присущи способности целителей.',r:'Станьте открытыми и любящими, уважайте людей, помогайте и поддерживайте. Научитесь прощать, избегайте контроля над близкими. Оптимизм, щедрость.',o:'Не злоупотребляйте способностями, не поддавайтесь соблазнам и порокам.'},
16:{t:'Создавать что-то новое: формировать личность, отношения, социальные и культурные связи. Строить конкретное: дома, скульптуры, предприятия.',r:'Занимайтесь духовной работой, внесите в повседневность высокие цели. Не занижайте планку. Медитируйте, ведите духовный дневник. Ищите новые пути.',o:'Если не хотите ничего менять — это ошибка. Вы наделены большой созидательной силой.'},
17:{t:'Создать и предъявить миру своё творчество. Вы должны сиять, быть заметным. Эмпатия, дружба, эмоциональная восприимчивость помогают.',r:'Следите за физической формой. Занимайтесь спортом, бывайте на природе, путешествуйте. Учитесь понимать чужие чувства. Разберитесь со страхами.',o:'Может помешать гордыня, звёздная болезнь либо критически низкая самооценка, неверие в талант.'},
18:{t:'Создавать особую атмосферу, наполнять пространство магией. Укреплять женское начало, интуицию, фантазию. Привносить гармонию в дом, семью, коллектив.',r:'Подумайте о целях, запишите и визуализируйте. Развивайтесь духовно, концентрируйтесь на хорошем. Тренируйте интуицию, записывайте сны. Ухаживайте за телом.',o:'Не замыкайтесь в себе. Равнодушие к другим, нежелание прислушаться к интуиции не позволят реализовать предназначение.'},
19:{t:'Использовать мудрость, харизму, благородство на всеобщее благо. Энергия солнца должна распространяться на всех. Развивайте доброту, честность, отеческое приятие.',r:'Смело беритесь за проекты, ведите за собой людей. Следите за эмоциями и мыслями. Отпустите старое, не цепляйтесь за материальное. Развивайте харизму.',o:'Опасно зацикливаться на своей персоне, самоустраняться из общества.'},
20:{t:'Разобраться с семейными отношениями и выстроить верную систему ценностей. Изучить историю рода, исправить ошибки прошлых поколений, явить миру правильное их понимание.',r:'Очистите мышление от негатива. Фиксируйте мысли, заведите дневник. Освободите дом от старых вещей. Не цепляйтесь за близких. Изучите генеалогию.',o:'Стыд за семью, разрыв с ней, оторванность от корней помешают исполнить предназначение.'},
21:{t:'Объединять людей, налаживать контакты между странами, культурами, чтобы обмениваться идеями и двигать человечество вперёд. Идея мира во всём мире.',r:'Объединяйте прогрессивное и светлое, изучайте дела и идеалы других. Медитируйте и визуализируйте. Станьте примером оптимизма. Воспринимайте мир целостно.',o:'Не опускайтесь в невежество, не возносите только свою нацию. Избегайте насилия.'},
22:{t:'Брать всё в свои руки и с лёгкостью приносить в мир новое. Энергия старта, запала, новых идей. Предприниматель, первооткрыватель, уникальный стартап.',r:'Изучайте языки, путешествуйте, рассказывайте о единстве мира. Научитесь лёгкости, но не пренебрегайте ответственностью. Примите законы социума. Позвольте себе обладать всем и ни за что не цепляться.',o:'Не ограничивайте себя. Не прерывайте поток идей слишком серьёзным отношением к жизни.'}
};

17:{name:'Творческие люди',desc:'Личности искусства: певцы и музыканты, артисты, лирики, актёры. Настоящие звёзды, одарённые творческие люди.'},
18:{name:'Сказочники, люди с богатым воображением и интуицией',desc:'Мастера, работающие руками, производящие и продающие товары для дома, создающие психологический комфорт. Сильные, волевые женщины.'},
19:{name:'Крупные политики и ораторы',desc:'Персоны на значимых постах, общественные авторитеты, лидеры мнений. Звёзды общества.'},

/* ========== РЕНДЕР ========== */
function section(icon, title, bodyHtml, open){
  return `<div class="section ${open?'open':''}">
    <div class="section-header">
      <h2><span class="icon">${icon}</span>${esc(title)}</h2>
      <span class="chev">▼</span>
    </div>
    <div class="section-body"><div class="section-inner">${bodyHtml}</div></div>
  </div>`;
}

function renderResults(data){
  const {work, pyth, pred, clan, nameNums, personalYear, finance, color, d, m, y, firstName, surname, patronymic, gender} = data;

  const badges = `
    <div class="numbers-row">
      <div class="num-badge">
        <div class="label">Число работы</div>
        <div class="value">${work}</div>
        <div class="planet">${PLANETS[work]||''}</div>
      </div>
      <div class="num-badge">
        <div class="label">Число судьбы</div>
        <div class="value">${pyth.counts[1]+pyth.counts[2]+pyth.counts[3]}</div>
        <div class="planet">Пифагор</div>
      </div>
      <div class="num-badge">
        <div class="label">Предназначение</div>
        <div class="value">${pred.total}</div>
        <div class="planet">Аркан</div>
      </div>
    </div>`;

  const workData = WORK_NUMBERS[work];
  const workSection = section('✦', workData.title, `<p>${esc(workData.text)}</p>`);

  const pythSection = section('❋', 'Квадрат Пифагора', renderPythagoras(pyth));

  const nameSection = section('✎', 'Число Имени', renderName(nameNums, firstName, surname, patronymic));

  const predData = PREDESTINATION[pred.total];
  const predSection = section('☉', 'Предназначение · Аркан ' + pred.total,
    `<div class="block-title">Ваше предназначение</div>
     <p>${esc(predData.t)}</p>
     <div class="block-title">Для самореализации</div>
     <p>${esc(predData.r)}</p>
     <div class="block-title">Обратная сторона</div>
     <p>${esc(predData.o)}</p>`);

  let clanSection = '';
  if(clan){
    const c = CLAN_PROGRAMS[clan.type];
    clanSection = section('❖', 'Родовая программа · Эгрегор ' + clan.type,
      `<div class="info-grid">
        <div class="info-cell"><div class="k">Тип рода</div><div class="v">${esc(c.name)}</div></div>
        <div class="info-cell"><div class="k">Аркан</div><div class="v">${clan.type}</div></div>
      </div>
      <p style="margin-top:12px">${esc(c.desc)}</p>
      ${clan.femaleTask?`<div class="block-title">Задача женщин рода</div><p>Эгрегор ${clan.femaleTask}</p>`:''}
      `);
  }

  const colorSection = section('◆', 'Цвет удачи',
    `<div class="info-grid">
      <div class="info-cell"><div class="k">Планета дня</div><div class="v">${esc(color.planet)}</div></div>
      <div class="info-cell"><div class="k">Ваши цвета</div><div class="v">${esc(color.colors)}</div></div>
    </div>`);

  let financeSection = '';
  if(finance){
    const months = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    let rows = '';
    for(let i=0;i<12;i++){
      const v = finance.months[i];
      rows += `<div class="info-cell"><div class="k">${months[i]}</div><div class="v">${v} — ${esc((FINANCE_MEANINGS[v]||'').slice(0,60))}…</div></div>`;

    financeSection = section('❋', 'Финансовый прогноз на ' + data.currentYear,

  const pyData = PERSONAL_YEAR[personalYear];
  const pySection = section('☾', 'Прогноз на ' + data.currentYear,
    `<div class="block-title">Персональное число года: ${personalYear}</div>
     <p>${esc(pyData)}</p>`);

  const compatSection = section('⚭', 'Совместимость',

       <div class="info-cell"><div class="k">Число работы</div><div class="v">${work}</div></div>

    + (financeSection || '')

function renderPythagoras(pyth){
  let html = `<div class="info-grid">
    <div class="info-cell"><div class="k">1-е доп. число</div><div class="v">${pyth.n1}</div></div>
    <div class="info-cell"><div class="k">2-е доп. число</div><div class="v">${pyth.n2}</div></div>
    <div class="info-cell"><div class="k">3-е доп. число</div><div class="v">${pyth.n3}</div></div>
    <div class="info-cell"><div class="k">4-е доп. число</div><div class="v">${pyth.n4}</div></div>
  </div>`;
  for(let i=1;i<=9;i++){
    const cnt = pyth.counts[i];
    const cell = PYTHAGORAS_CELLS[i];
    let meaning = '';
    if(cnt === 0) meaning = cell.meanings[0] || 'Качество отсутствует или проявляется нестабильно.';
    else if(cnt === 1) meaning = cell.meanings[1] || cell.meanings[0] || '';
    else if(cnt === 2) meaning = cell.meanings[2] || cell.meanings[0] || '';
    else if(cnt === 3) meaning = cell.meanings[3] || cell.meanings[0] || '';
    else if(cnt === 4) meaning = cell.meanings[4] || cell.meanings[3] || '';
    else if(cnt === 5) meaning = cell.meanings[5] || cell.meanings[4] || '';
    else meaning = cell.meanings[6] || cell.meanings[5] || '';
    html += `<div class="cell-block">
      <h3>${i}. ${esc(cell.name)} — ${cnt} ${cnt===0?'':cnt===1?'цифра':cnt<5?'цифры':'цифр'}</h3>
      <p>${esc(meaning)}</p>
    </div>`;
  }
  return html;
}

function renderName(nameNums, firstName, surname, patronymic){
  return `
    <div class="block-title">Число выражения</div>
    <p><strong>${nameNums.expr}</strong> — ${esc(NAME_EXPR[nameNums.expr] || NAME_EXPR[reduce9(nameNums.expr)] || '')}</p>
    <div class="block-title">Число сердца</div>
    <p><strong>${nameNums.heart}</strong> — ${esc(NAME_HEART[nameNums.heart] || NAME_HEART[reduce9(nameNums.heart)] || '')}</p>
    <div class="block-title">Число индивидуальности</div>
    <p><strong>${nameNums.indiv}</strong> — ${esc(NAME_INDIV[nameNums.indiv] || NAME_INDIV[reduce9(nameNums.indiv)] || '')}</p>
    <div class="block-title">Разбор букв</div>
    <p>Имя: ${esc(firstName||'—')} · Фамилия: ${esc(surname||'—')} · Отчество: ${esc(patronymic||'—')}</p>
  `;
}

/* ========== ОСНОВНОЙ ПРОЦЕСС ========== */
const formCard = document.getElementById('formCard');
const loading = document.getElementById('loading');
const results = document.getElementById('results');
const resetBtn = document.getElementById('resetBtn');

document.getElementById('calcBtn').addEventListener('click', function(){
  const d = parseInt(document.getElementById('day').value, 10);
  const m = parseInt(document.getElementById('month').value, 10);
  const y = parseInt(document.getElementById('year').value, 10);
  const firstName = document.getElementById('firstName').value.trim();
  const surname = document.getElementById('surname').value.trim();
  const patronymic = document.getElementById('patronymic').value.trim();
  const fatherName = document.getElementById('fatherName').value.trim();
  const gender = document.getElementById('gender').value;

  if(!d || !m || !y || d<1 || d>31 || m<1 || m>12 || y<1900 || y>2100){
    notify('Проверьте дату рождения: день 1–31, месяц 1–12, год 1900–2100.');
    return;
  }
  if(!firstName){
    notify('Введите имя.');
    return;
  }

  formCard.style.display = 'none';
  loading.classList.add('show');

  setTimeout(function(){
    try {
      const currentYear = new Date().getFullYear();
      const work = calcWorkNumber(d, m, y);
      const pyth = calcPythagoras(d, m, y);
      const pred = calcPredestination(d, m, y);
      const clan = calcClan(surname, gender);
      const nameNums = calcNameNumbers(firstName, surname, patronymic);
      const personalYear = calcPersonalYear(d, m, currentYear);
      const finance = calcFinance(d, m, y, fatherName || firstName, firstName, currentYear);
      const color = COLORS_BY_DAY[d] || {planet:'—', colors:'—'};

      const data = {
        d, m, y, firstName, surname, patronymic, gender,
        work, pyth, pred, clan, nameNums, personalYear, finance, color,
        currentYear
      };

      results.innerHTML = renderResults(data);
      results.classList.add('show');
      loading.classList.remove('show');
      resetBtn.classList.add('show');

      // Слушатели на секции
      document.querySelectorAll('.section-header').forEach(h => {
        h.addEventListener('click', () => {
          h.parentElement.classList.toggle('open');
        });
      });

      // Прокрутка к результатам
      results.scrollIntoView({behavior:'smooth', block:'start'});
    } catch(e){
      loading.classList.remove('show');
      formCard.style.display = '';
      notify('Ошибка расчёта: ' + e.message);
      console.error(e);
    }
  }, 350);
});

resetBtn.addEventListener('click', function(){
  results.innerHTML = '';
  results.classList.remove('show');
  resetBtn.classList.remove('show');
  formCard.style.display = '';
  formCard.scrollIntoView({behavior:'smooth', block:'start'});
});

})();
</script>
